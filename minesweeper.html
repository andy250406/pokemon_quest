<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minesweeper - 지뢰찾기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      background: #0b101b;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }

    .game-screen {
      width: 100vw;
      height: 100vh;
      max-width: 560px;
      position: relative;
      background: #f8fafc;
      background-image: 
        radial-gradient(at 10% 10%, rgba(224, 242, 254, 0.7) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(254, 243, 199, 0.6) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.8) 0px, transparent 50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 10px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 🏷️ 1행: 최상단 네비게이션 */
    .top-nav {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      box-sizing: border-box;
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #334155;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.15s ease;
    }
    .btn-nav:active {
      transform: scale(0.95);
      background: rgba(226, 232, 240, 0.8);
    }
    .btn-nav.icon-only {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 10px;
      font-size: 15px;
    }
    .header-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 🕹️ 2행: 게임 정보 & 크기 & 난이도 컨트롤 바구니 칸 */
    .game-info-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin-bottom: 6px;
      padding: 5px 6px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      box-sizing: border-box;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    .info-stat-pill {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      padding: 6px 8px;
      font-size: 11.5px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
      white-space: nowrap;
    }
    select {
      flex: 0 1 auto;
      width: auto;
      max-width: 138px;
      padding: 6px 4px;
      font-size: 11px;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      cursor: pointer;
      font-weight: 800;
      outline: none;
      transition: all 0.15s ease;
      touch-action: manipulation;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
      white-space: nowrap;
    }
    .btn-action {
      padding: 6px 8px;
      font-size: 11.5px;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      cursor: pointer;
      font-weight: 800;
      outline: none;
      transition: all 0.15s ease;
      touch-action: manipulation;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    }
    .btn-action:active {
      transform: scale(0.95);
      background: rgba(226, 232, 240, 0.8);
    }
    .btn-action.btn-refresh-only {
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border-radius: 10px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #334155;
    }

    /* 🎨 캔버스 뷰포트 컨테이너 (줌 & 패닝 뷰포트) */
    #canvas-container {
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 2px solid rgba(0, 0, 0, 0.08);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      background: rgba(241, 245, 249, 0.95);
      touch-action: none;
      overflow: hidden;
      margin-bottom: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      touch-action: none;
    }

    /* 🕹️ 하단 툴바: 줌 컨트롤러 + 모드 전환 바 */
    .bottom-toolbar {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-sizing: border-box;
    }
    .bottom-mode-bar {
      width: 100%;
      display: flex;
      gap: 6px;
      box-sizing: border-box;
    }
    .btn-mode-toggle {
      flex: 1;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 800;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.08);
      background: rgba(255, 255, 255, 0.75);
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: all 0.15s ease;
    }
    .btn-mode-toggle.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.35);
    }
    .btn-mode-toggle.flag-mode.active {
      background: #ea580c;
      border-color: #ea580c;
      box-shadow: 0 3px 10px rgba(234, 88, 12, 0.35);
    }

    /* 🔍 줌 컨트롤러 바 */
    .zoom-ctrl-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.65);
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.06);
    }
    .btn-zoom {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #334155;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .btn-zoom:active {
      transform: scale(0.92);
      background: rgba(226, 232, 240, 0.8);
    }
    .zoom-text {
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      min-width: 48px;
      text-align: center;
    }

    /* ✨ 클리어 / 실패 / 기록 모달 공통 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      padding: 16px;
      text-align: center;
      color: #0f172a;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .clear-title {
      font-size: 20px;
      font-weight: 900;
      color: #16a34a;
      margin-bottom: 6px;
    }
    .fail-title {
      font-size: 20px;
      font-weight: 900;
      color: #dc2626;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 13px;
      color: #334155;
      font-weight: 600;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .xp-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
      box-shadow: 0 3px 10px rgba(245, 158, 11, 0.35);
    }
    .modal-btns {
      display: flex;
      gap: 8px;
    }
    .btn-modal-next {
      background: #16a34a;
      color: white;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(22, 163, 74, 0.3);
    }
    .btn-modal-next:active { transform: scale(0.95); }
    .btn-modal-retry {
      background: #fee2e2;
      color: #ef4444;
      border: 1px solid #fca5a5;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn-modal-retry:active { transform: scale(0.95); }

    /* 🏆 기록 리스트 팝업 모달 */
    .record-box {
      width: 88%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      color: #0f172a;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .record-box h3 {
      font-size: 15px;
      font-weight: 900;
      color: #d97706;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .record-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      font-size: 12px;
    }
    .record-row:last-child {
      border-bottom: none;
    }
    .record-diff {
      font-weight: 800;
      color: #0f172a;
    }
    .record-stat {
      font-weight: 800;
      color: #0284c7;
    }
    .record-max {
      font-size: 10.5px;
      color: #64748b;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="game-screen">

    <!-- 🏷️ 1행: 최상단 네비게이션 -->
    <div class="top-nav">
      <button class="btn-nav icon-only" onclick="closeGameAndReturn()" title="포켓Tasks로 복귀" style="font-size:18px; font-weight:900;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="header-title">
        💣 Minesweeper
      </div>
      <button class="btn-nav icon-only" onclick="openRecordsModal()" title="난이도별 연승 기록">
        🏆
      </button>
    </div>

    <!-- 🕹️ 2행: 남은 지뢰 수 & 칸 크기 & 난이도 & 새로고침 바구니 칸 -->
    <div class="game-info-bar">
      <div class="info-stat-pill">
        <span style="color:#ef4444;">🚩</span>
        <span style="color:#0f172a;" id="mineCountText">0</span>
      </div>
      <select id="sizeSelect" onchange="generateStage()">
        <option value="16x24">16x24 (+0XP)</option>
        <option value="20x30" selected>20x30 (+10XP)</option>
        <option value="26x38">26x38 (+20XP)</option>
        <option value="32x46">32x46 (+40XP)</option>
      </select>
      <select id="diffSelect" onchange="generateStage()">
        <option value="normal" selected>🟢 보통 (+20XP)</option>
        <option value="hard">🔥 어려움 (+30XP)</option>
        <option value="minefield">💀 지뢰밭 (+40XP)</option>
      </select>
      <button class="btn-action btn-refresh-only" onclick="generateStage()" title="새 맵 생성">🔄</button>
    </div>

    <!-- 🎨 줌 & 패닝 지원 캔버스 뷰포트 컨테이너 -->
    <div id="canvas-container">
      <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 🕹️ 하단 툴바: 줌 컨트롤러 & 모드 전환 바 -->
    <div class="bottom-toolbar">
      <div class="zoom-ctrl-bar">
        <button class="btn-zoom" onclick="adjustZoom(-0.2)" title="축소">➖</button>
        <span class="zoom-text" id="zoomLevelText">100%</span>
        <button class="btn-zoom" onclick="adjustZoom(0.2)" title="확대">➕</button>
        <button class="btn-zoom" onclick="resetZoomFit()" title="화면에 맞추기">🎯 맞춤</button>
        <button class="btn-zoom" onclick="centerView()" title="중앙 이동">📍 중앙</button>
      </div>
      <div class="bottom-mode-bar">
        <button class="btn-mode-toggle active" id="btnModeDig" onclick="setInteractionMode('DIG')">
          🔍 칸 열기
        </button>
        <button class="btn-mode-toggle flag-mode" id="btnModeFlag" onclick="setInteractionMode('FLAG')">
          🚩 깃발 꽂기
        </button>
      </div>
    </div>

    <!-- 🎉 스테이지 클리어 모달 -->
    <div class="modal-overlay" id="clearModal">
      <div class="clear-title" id="clearTitleText">🎉 CLEAR!</div>
      <div class="modal-desc" id="clearDescText">모든 지뢰를 피해 안전하게 탐사 완료했습니다!</div>
      <div class="xp-badge" id="clearXpBadge">+30 XP 획득! 🎁</div>
      <div class="modal-btns">
        <button class="btn-modal-next" onclick="generateStage()">다음 맵 🚀</button>
      </div>
    </div>

    <!-- 💥 스테이지 실패 모달 -->
    <div class="modal-overlay" id="failModal">
      <div class="fail-title">💥 지뢰 폭발!</div>
      <div class="modal-desc">지뢰를 밟아 탐사가 중단되었습니다.<br>다시 도전해 보세요!</div>
      <div class="modal-btns">
        <button class="btn-modal-retry" onclick="generateStage()">다시 도전 🔄</button>
      </div>
    </div>

    <!-- 🏆 난이도별 연승 기록 모달 -->
    <div class="modal-overlay" id="recordsModal">
      <div class="record-box">
        <h3>
          <span>🏆 난이도별 연승 기록</span>
          <span style="cursor:pointer; font-size:16px;" onclick="closeRecordsModal()">✕</span>
        </h3>
        <div class="record-row">
          <span class="record-diff">🟢 보통</span>
          <div>
            <span class="record-stat" id="recStreak_normal">0연승</span> <span class="record-max" id="recMax_normal">(최고 0)</span>
          </div>
        </div>
        <div class="record-row">
          <span class="record-diff">🔥 어려움</span>
          <div>
            <span class="record-stat" id="recStreak_hard">0연승</span> <span class="record-max" id="recMax_hard">(최고 0)</span>
          </div>
        </div>
        <div class="record-row">
          <span class="record-diff">💀 지뢰밭</span>
          <div>
            <span class="record-stat" id="recStreak_minefield">0연승</span> <span class="record-max" id="recMax_minefield">(최고 0)</span>
          </div>
        </div>
        <div style="margin-top:14px; text-align:center;">
          <button class="btn-action" style="padding:6px 18px;" onclick="closeRecordsModal()">닫기</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ========================================================
    // ⚙️ 환경 설정 및 경험치 규칙
    // ========================================================
    const SIZE_CONFIG = {
      "16x24": { cols: 16, rows: 24, sizeXp: 0 },
      "20x30": { cols: 20, rows: 30, sizeXp: 10 },
      "26x38": { cols: 26, rows: 38, sizeXp: 20 },
      "32x46": { cols: 32, rows: 46, sizeXp: 40 }
    };

    const DIFF_CONFIG = {
      "normal": { name: "보통", density: 0.12, diffXp: 20 },
      "hard": { name: "어려움", density: 0.16, diffXp: 30 },
      "minefield": { name: "지뢰밭", density: 0.21, diffXp: 40 }
    };

    const NUMBER_COLORS = [
      "",
      "#2563eb", // 1: 파랑
      "#16a34a", // 2: 초록
      "#dc2626", // 3: 빨강
      "#7c3aed", // 4: 보라
      "#ea580c", // 5: 주황
      "#0891b2", // 6: 청록
      "#0f172a", // 7: 검정
      "#64748b"  // 8: 회색
    ];

    let COLS = 20;
    let ROWS = 30;
    const CELL_SIZE = 30; // 🌟 넉넉하고 큼직한 고정 셀 크기 (30px)
    let totalMines = 0;
    let flagsPlaced = 0;
    let isGameOver = false;
    let isGameWon = false;
    let isFirstClick = true;
    let interactionMode = "DIG"; // "DIG" 또는 "FLAG"
    let sessionTotalEarnedXp = 0;

    // 🌟 카메라 줌 & 패닝 상태 변수
    let zoomScale = 1.0;
    let panOffsetX = 0;
    let panOffsetY = 0;

    // 보드 데이터 구조: { isMine, isOpen, isFlag, count }
    let board = [];

    const container = document.getElementById('canvas-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // ========================================================
    // 📳 햅틱 진동
    // ========================================================
    function triggerHaptic(pattern = 30) {
      if (typeof navigator !== "undefined" && "vibrate" in navigator) {
        try { navigator.vibrate(pattern); } catch(e) {}
      }
    }

    // ========================================================
    // 🏆 연승 기록 관리 (localStorage)
    // ========================================================
    function loadGameRecords() {
      try {
        const data = localStorage.getItem('minesweeper_records_v1');
        return data ? JSON.parse(data) : {};
      } catch(e) { return {}; }
    }

    function saveGameRecords(records) {
      try { localStorage.setItem('minesweeper_records_v1', JSON.stringify(records)); } catch(e) {}
    }

    function getStageRecord(diffKey) {
      const rec = loadGameRecords();
      return rec[diffKey] || { currentStreak: 0, maxStreak: 0 };
    }

    function updateStreakOnClear(diffKey) {
      const rec = loadGameRecords();
      if (!rec[diffKey]) rec[diffKey] = { currentStreak: 0, maxStreak: 0 };
      rec[diffKey].currentStreak = (rec[diffKey].currentStreak || 0) + 1;
      if (rec[diffKey].currentStreak > (rec[diffKey].maxStreak || 0)) {
        rec[diffKey].maxStreak = rec[diffKey].currentStreak;
      }
      saveGameRecords(rec);
      return rec[diffKey];
    }

    function resetStreakOnFail(diffKey) {
      const rec = loadGameRecords();
      if (rec[diffKey]) {
        rec[diffKey].currentStreak = 0;
        saveGameRecords(rec);
      }
    }

    function openRecordsModal() {
      const rec = loadGameRecords();
      ["normal", "hard", "minefield"].forEach(key => {
        const item = rec[key] || { currentStreak: 0, maxStreak: 0 };
        document.getElementById(`recStreak_${key}`).innerText = `${item.currentStreak || 0}연승`;
        document.getElementById(`recMax_${key}`).innerText = `(최고 ${item.maxStreak || 0}연승)`;
      });
      document.getElementById('recordsModal').classList.add('show');
    }

    function closeRecordsModal() {
      document.getElementById('recordsModal').classList.remove('show');
    }

    // ========================================================
    // 🕹️ 조작 모드 전환
    // ========================================================
    function setInteractionMode(mode) {
      interactionMode = mode;
      document.getElementById('btnModeDig').classList.toggle('active', mode === 'DIG');
      document.getElementById('btnModeFlag').classList.toggle('active', mode === 'FLAG');
      triggerHaptic(20);
    }

    function updateStatusDisplay() {
      const remaining = Math.max(0, totalMines - flagsPlaced);
      document.getElementById('mineCountText').innerText = `${remaining}`;
      document.getElementById('zoomLevelText').innerText = `${Math.round(zoomScale * 100)}%`;
    }

    // ========================================================
    // 🔍 줌 & 뷰포트 패닝 제어 시스템
    // ========================================================
    function adjustZoom(delta) {
      const oldZoom = zoomScale;
      zoomScale = Math.max(0.45, Math.min(2.2, zoomScale + delta));

      // 뷰포트 중앙 기준 줌 조정
      const cW = container.clientWidth;
      const cH = container.clientHeight;
      const factor = zoomScale / oldZoom;
      panOffsetX = cW / 2 - (cW / 2 - panOffsetX) * factor;
      panOffsetY = cH / 2 - (cH / 2 - panOffsetY) * factor;

      clampPanOffset();
      updateStatusDisplay();
      draw();
      triggerHaptic(20);
    }

    function resetZoomFit() {
      const cW = container.clientWidth;
      const cH = container.clientHeight;
      const mapW = COLS * CELL_SIZE;
      const mapH = ROWS * CELL_SIZE;

      const scaleX = (cW - 16) / mapW;
      const scaleY = (cH - 16) / mapH;
      zoomScale = Math.max(0.4, Math.min(1.2, Math.min(scaleX, scaleY)));

      centerView();
      triggerHaptic(25);
    }

    function centerView() {
      const cW = container.clientWidth;
      const cH = container.clientHeight;
      const mapW = COLS * CELL_SIZE * zoomScale;
      const mapH = ROWS * CELL_SIZE * zoomScale;

      panOffsetX = (cW - mapW) / 2;
      panOffsetY = (cH - mapH) / 2;

      clampPanOffset();
      updateStatusDisplay();
      draw();
    }

    function clampPanOffset() {
      const cW = container.clientWidth;
      const cH = container.clientHeight;
      const mapW = COLS * CELL_SIZE * zoomScale;
      const mapH = ROWS * CELL_SIZE * zoomScale;

      // 맵이 뷰포트보다 작으면 가운데 고정, 크면 여백 제한
      if (mapW <= cW) {
        panOffsetX = (cW - mapW) / 2;
      } else {
        const minX = cW - mapW - 40;
        const maxX = 40;
        panOffsetX = Math.max(minX, Math.min(maxX, panOffsetX));
      }

      if (mapH <= cH) {
        panOffsetY = (cH - mapH) / 2;
      } else {
        const minY = cH - mapH - 40;
        const maxY = 40;
        panOffsetY = Math.max(minY, Math.min(maxY, panOffsetY));
      }
    }

    function resizeCanvas() {
      const cW = container.clientWidth;
      const cH = container.clientHeight;
      if (cW > 0 && cH > 0) {
        canvas.width = cW;
        canvas.height = cH;
        draw();
      }
    }

    // ========================================================
    // 🔄 맵 생성 및 초기화
    // ========================================================
    function generateStage() {
      document.getElementById('clearModal').classList.remove('show');
      document.getElementById('failModal').classList.remove('show');
      document.getElementById('recordsModal').classList.remove('show');

      const sizeKey = document.getElementById('sizeSelect').value;
      const diffKey = document.getElementById('diffSelect').value;

      const sizeCfg = SIZE_CONFIG[sizeKey] || SIZE_CONFIG["20x30"];
      const diffCfg = DIFF_CONFIG[diffKey] || DIFF_CONFIG["normal"];

      COLS = sizeCfg.cols;
      ROWS = sizeCfg.rows;
      totalMines = Math.floor(COLS * ROWS * diffCfg.density);
      flagsPlaced = 0;
      isGameOver = false;
      isGameWon = false;
      isFirstClick = true;

      // 빈 보드 생성
      board = Array.from({ length: ROWS }, () =>
        Array.from({ length: COLS }, () => ({
          isMine: false,
          isOpen: false,
          isFlag: false,
          count: 0
        }))
      );

      resizeCanvas();
      resetZoomFit();
      updateStatusDisplay();
    }

    // 첫 클릭 시 안전 구역(지뢰 0개) 보장 지뢰 심기
    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < totalMines) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);

        // 첫 클릭한 칸 및 8방향 인접칸 제외
        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
        if (board[r][c].isMine) continue;

        board[r][c].isMine = true;
        planted++;
      }

      // 각 칸 주변 지뢰 수 계산
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) continue;
          let cnt = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isMine) {
                cnt++;
              }
            }
          }
          board[r][c].count = cnt;
        }
      }
    }

    // ========================================================
    // 🎨 렌더링 시스템 (화이트 글래스모피즘 & 줌/팬 적용)
    // ========================================================
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      // 🌟 카메라 오프셋 및 줌 적용
      ctx.translate(panOffsetX, panOffsetY);
      ctx.scale(zoomScale, zoomScale);

      // 전체 맵 배경 그림자
      const mapW = COLS * CELL_SIZE;
      const mapH = ROWS * CELL_SIZE;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, mapW, mapH);

      // 뷰포트에 보이는 타일만 효율적으로 렌더링 (Frustum Culling)
      const visibleMinC = Math.max(0, Math.floor(-panOffsetX / (CELL_SIZE * zoomScale)));
      const visibleMaxC = Math.min(COLS - 1, Math.ceil((canvas.width - panOffsetX) / (CELL_SIZE * zoomScale)));
      const visibleMinR = Math.max(0, Math.floor(-panOffsetY / (CELL_SIZE * zoomScale)));
      const visibleMaxR = Math.min(ROWS - 1, Math.ceil((canvas.height - panOffsetY) / (CELL_SIZE * zoomScale)));

      for (let r = visibleMinR; r <= visibleMaxR; r++) {
        for (let c = visibleMinC; c <= visibleMaxC; c++) {
          const cell = board[r][c];
          const x = c * CELL_SIZE;
          const y = r * CELL_SIZE;

          if (cell.isOpen) {
            if (cell.isMine) {
              // 밟은 지뢰
              ctx.fillStyle = '#fee2e2';
              ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);
              ctx.font = `${Math.floor(CELL_SIZE * 0.65)}px sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('💣', x + CELL_SIZE / 2, y + CELL_SIZE / 2);
            } else {
              // 열린 빈칸
              ctx.fillStyle = '#f8fafc';
              ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);

              if (cell.count > 0) {
                ctx.fillStyle = NUMBER_COLORS[cell.count] || '#0f172a';
                ctx.font = `900 ${Math.floor(CELL_SIZE * 0.68)}px -apple-system, BlinkMacSystemFont, sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(cell.count, x + CELL_SIZE / 2, y + CELL_SIZE / 2 + 1);
              }
            }
          } else {
            // 닫힌 칸 (화이트 글래스 버튼)
            ctx.fillStyle = '#e2e8f0';
            ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2);

            // 입체 하이라이트
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(x + 1, y + 1, CELL_SIZE - 2, 2);
            ctx.fillRect(x + 1, y + 1, 2, CELL_SIZE - 2);

            if (cell.isFlag) {
              ctx.font = `${Math.floor(CELL_SIZE * 0.65)}px sans-serif`;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('🚩', x + CELL_SIZE / 2, y + CELL_SIZE / 2);
            }
          }

          // 격자선
          ctx.strokeStyle = 'rgba(0, 0, 0, 0.08)';
          ctx.lineWidth = 1;
          ctx.strokeRect(x, y, CELL_SIZE, CELL_SIZE);
        }
      }

      // 전체 맵 외곽 테두리
      ctx.strokeStyle = 'rgba(2, 132, 199, 0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 0, mapW, mapH);

      ctx.restore();
    }

    // ========================================================
    // 👆 스마트 터치 제스처 & 마우스 조작 (패닝 / 탭 / 핀치줌)
    // ========================================================
    let isDragging = false;
    let startPointerPos = { x: 0, y: 0 };
    let lastPointerPos = { x: 0, y: 0 };
    let longPressTimer = null;
    let isLongPressFired = false;
    let initialPinchDistance = null;
    let initialZoomScale = 1.0;

    function screenToBoardCoords(screenX, screenY) {
      const rect = container.getBoundingClientRect();
      const clickX = screenX - rect.left;
      const clickY = screenY - rect.top;

      const boardX = (clickX - panOffsetX) / zoomScale;
      const boardY = (clickY - panOffsetY) / zoomScale;

      const c = Math.floor(boardX / CELL_SIZE);
      const r = Math.floor(boardY / CELL_SIZE);
      return { r, c };
    }

    // 마우스 휠 줌 (커서 위치 기준)
    container.addEventListener('wheel', (e) => {
      e.preventDefault();
      const rect = container.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
      const newZoom = Math.max(0.4, Math.min(2.5, zoomScale * zoomFactor));

      panOffsetX = mouseX - (mouseX - panOffsetX) * (newZoom / zoomScale);
      panOffsetY = mouseY - (mouseY - panOffsetY) * (newZoom / zoomScale);
      zoomScale = newZoom;

      clampPanOffset();
      updateStatusDisplay();
      draw();
    }, { passive: false });

    // 멀티 터치 핀치 줌 & 싱글 터치 패닝/탭 이벤트
    container.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        // 핀치 줌 시작
        clearTimeout(longPressTimer);
        isLongPressFired = true;
        isDragging = false;
        initialPinchDistance = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialZoomScale = zoomScale;
        return;
      }

      if (e.touches.length === 1) {
        const touch = e.touches[0];
        startPointerPos = { x: touch.clientX, y: touch.clientY };
        lastPointerPos = { x: touch.clientX, y: touch.clientY };
        isDragging = false;
        isLongPressFired = false;

        const coords = screenToBoardCoords(touch.clientX, touch.clientY);

        // 260ms 길게 누르면 깃발 꽂기
        longPressTimer = setTimeout(() => {
          if (!isDragging && coords.r >= 0 && coords.r < ROWS && coords.c >= 0 && coords.c < COLS) {
            isLongPressFired = true;
            toggleFlag(coords.r, coords.c);
            triggerHaptic(45);
            draw();
          }
        }, 260);
      }
    }, { passive: false });

    container.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDistance) {
        // 핀치 줌 계산
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = dist / initialPinchDistance;
        zoomScale = Math.max(0.4, Math.min(2.5, initialZoomScale * factor));
        clampPanOffset();
        updateStatusDisplay();
        draw();
        return;
      }

      if (e.touches.length === 1) {
        const touch = e.touches[0];
        const dx = touch.clientX - lastPointerPos.x;
        const dy = touch.clientY - lastPointerPos.y;
        const totalDist = Math.hypot(touch.clientX - startPointerPos.x, touch.clientY - startPointerPos.y);

        if (totalDist > 8) {
          clearTimeout(longPressTimer);
          isDragging = true;
          panOffsetX += dx;
          panOffsetY += dy;
          clampPanOffset();
          draw();
        }
        lastPointerPos = { x: touch.clientX, y: touch.clientY };
      }
    }, { passive: false });

    container.addEventListener('touchend', (e) => {
      clearTimeout(longPressTimer);
      if (e.touches.length === 0) {
        if (!isDragging && !isLongPressFired) {
          // 탭 이벤트 발생!
          const coords = screenToBoardCoords(startPointerPos.x, startPointerPos.y);
          if (coords.r >= 0 && coords.r < ROWS && coords.c >= 0 && coords.c < COLS) {
            if (interactionMode === "FLAG") {
              toggleFlag(coords.r, coords.c);
            } else {
              handleClickCell(coords.r, coords.c);
            }
            draw();
          }
        }
        isDragging = false;
        initialPinchDistance = null;
      }
    });

    // PC 마우스 드래그 & 클릭 이벤트
    let isMouseDown = false;

    container.addEventListener('mousedown', (e) => {
      isMouseDown = true;
      isDragging = false;
      startPointerPos = { x: e.clientX, y: e.clientY };
      lastPointerPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mousemove', (e) => {
      if (!isMouseDown) return;
      const dx = e.clientX - lastPointerPos.x;
      const dy = e.clientY - lastPointerPos.y;
      const totalDist = Math.hypot(e.clientX - startPointerPos.x, e.clientY - startPointerPos.y);

      if (totalDist > 6) {
        isDragging = true;
        panOffsetX += dx;
        panOffsetY += dy;
        clampPanOffset();
        draw();
      }
      lastPointerPos = { x: e.clientX, y: e.clientY };
    });

    window.addEventListener('mouseup', (e) => {
      if (!isMouseDown) return;
      isMouseDown = false;
      if (!isDragging && e.target.closest('#canvas-container')) {
        const coords = screenToBoardCoords(e.clientX, e.clientY);
        if (coords.r >= 0 && coords.r < ROWS && coords.c >= 0 && coords.c < COLS) {
          if (e.button === 2 || interactionMode === "FLAG") {
            toggleFlag(coords.r, coords.c);
          } else {
            handleClickCell(coords.r, coords.c);
          }
          draw();
        }
      }
      isDragging = false;
    });

    container.addEventListener('contextmenu', (e) => e.preventDefault());

    // ========================================================
    // 🚩 깃발 & 🔍 칸 열기 & Chord
    // ========================================================
    function toggleFlag(r, c) {
      if (isGameOver || board[r][c].isOpen) return;
      board[r][c].isFlag = !board[r][c].isFlag;
      flagsPlaced += board[r][c].isFlag ? 1 : -1;
      triggerHaptic(25);
      updateStatusDisplay();
    }

    function handleClickCell(r, c) {
      if (isGameOver) return;
      const cell = board[r][c];

      // 1) 이미 열린 숫자 칸 탭 -> 주변 깃발 수가 일치하면 미개봉 칸 일괄 오픈 (Chord)
      if (cell.isOpen && cell.count > 0) {
        let flagCount = 0;
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].isFlag) {
              flagCount++;
            }
          }
        }
        if (flagCount === cell.count) {
          triggerHaptic(30);
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !board[nr][nc].isOpen && !board[nr][nc].isFlag) {
                openCell(nr, nc);
              }
            }
          }
          checkWinCondition();
        }
        return;
      }

      if (cell.isOpen || cell.isFlag) return;

      // 2) 첫 클릭 안전 처리
      if (isFirstClick) {
        isFirstClick = false;
        plantMines(r, c);
      }

      triggerHaptic(20);
      openCell(r, c);
      checkWinCondition();
    }

    function openCell(r, c) {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      const cell = board[r][c];
      if (cell.isOpen || cell.isFlag) return;

      cell.isOpen = true;

      if (cell.isMine) {
        handleGameFail();
        return;
      }

      // 0인 경우 주변 8칸 연쇄 오픈
      if (cell.count === 0) {
        const queue = [{ r, c }];
        while (queue.length > 0) {
          const cur = queue.shift();
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = cur.r + dr, nc = cur.c + dc;
              if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                const nextCell = board[nr][nc];
                if (!nextCell.isOpen && !nextCell.isFlag && !nextCell.isMine) {
                  nextCell.isOpen = true;
                  if (nextCell.count === 0) {
                    queue.push({ r: nr, c: nc });
                  }
                }
              }
            }
          }
        }
      }
    }

    // ========================================================
    // 🏆 승리 & 실패 판정 및 경험치 지급
    // ========================================================
    function checkWinCondition() {
      if (isGameOver) return;

      let unOpenedNonMines = 0;
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (!board[r][c].isMine && !board[r][c].isOpen) {
            unOpenedNonMines++;
          }
        }
      }

      if (unOpenedNonMines === 0) {
        handleGameWin();
      }
    }

    function handleGameWin() {
      isGameOver = true;
      isGameWon = true;
      triggerHaptic([60, 50, 80, 60, 160]);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) board[r][c].isFlag = true;
        }
      }
      flagsPlaced = totalMines;
      updateStatusDisplay();

      const sizeKey = document.getElementById('sizeSelect').value;
      const diffKey = document.getElementById('diffSelect').value;
      const sizeCfg = SIZE_CONFIG[sizeKey] || SIZE_CONFIG["20x30"];
      const diffCfg = DIFF_CONFIG[diffKey] || DIFF_CONFIG["normal"];

      // 🌟 [경험치 공식]: 칸수별 XP (0/10/20/40) + 난이도별 XP (20/30/40)
      const totalReward = sizeCfg.sizeXp + diffCfg.diffXp;
      const updatedRec = updateStreakOnClear(diffKey);

      document.getElementById('clearTitleText').innerText = `🎉 ${diffCfg.name} 난이도 ${updatedRec.currentStreak}연승 Clear!`;
      document.getElementById('clearDescText').innerHTML = `
        맵 크기: <b>${sizeKey} (+${sizeCfg.sizeXp} XP)</b><br>
        난이도: <b>${diffCfg.name} (+${diffCfg.diffXp} XP)</b><br>
        모든 지뢰를 찾아내 안전하게 탐사를 마쳤습니다!
      `;
      document.getElementById('clearXpBadge').innerText = `총 +${totalReward} XP 획득! 🎁`;
      document.getElementById('clearModal').classList.add('show');

      // 세션 누적 경험치 가산 & 로컬 저장
      sessionTotalEarnedXp += totalReward;
      try {
        localStorage.setItem('MINESWEEPER_PENDING_XP', sessionTotalEarnedXp);
      } catch(e) {}
    }

    function handleGameFail() {
      isGameOver = true;
      triggerHaptic([100, 80, 120]);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (board[r][c].isMine) board[r][c].isOpen = true;
        }
      }

      const diffKey = document.getElementById('diffSelect').value;
      resetStreakOnFail(diffKey);
      document.getElementById('failModal').classList.add('show');
    }

    // ========================================================
    // 🚪 포켓Tasks로 복귀 (모아둔 경험치 한 번에 전달!)
    // ========================================================
    function closeGameAndReturn() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'GAME_FINISHED_RETURN',
          gameType: 'minesweeper',
          gameName: 'Minesweeper',
          totalXp: sessionTotalEarnedXp
        }, '*');
      } else {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = './index.html?rewardXp=' + sessionTotalEarnedXp;
        }
      }
    }

    window.onload = () => {
      generateStage();
    };

    window.onresize = () => {
      resizeCanvas();
      clampPanOffset();
      draw();
    };
  </script>
</body>
</html>
