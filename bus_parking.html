<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Bus Parking - 포켓Tasks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <meta name="theme-color" content="#060913">

  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #0f172a;
      color: #0f172a;
    }

    .game-screen {
      width: 100%;
      height: 100%;
      position: relative;
      background: #f8fafc;
      background-image: 
        radial-gradient(at 10% 10%, rgba(224, 242, 254, 0.7) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(254, 243, 199, 0.6) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(241, 245, 249, 0.8) 0px, transparent 50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px env(safe-area-inset-bottom, 10px) 12px;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* 🏷️ 1행: 최상단 네비게이션 */
    .top-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
      padding: 0 2px;
      box-sizing: border-box;
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #334155;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.15s ease;
    }
    .btn-nav:active {
      transform: scale(0.95);
      background: rgba(226, 232, 240, 0.8);
    }
    .btn-nav.icon-only {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 10px;
      font-size: 15px;
    }

    .header-title {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 🕹️ 2행: 스도쿠 패밀리룩 글래스모피즘 정보 바구니 */
    .game-info-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 6px;
      padding: 5px 8px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 14px;
      box-sizing: border-box;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }
    .info-stat-pill {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 11.5px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    }

    select {
      flex: 0 1 auto;
      width: auto;
      max-width: 130px;
      padding: 5px 6px;
      font-size: 11.5px;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.85);
      color: #0f172a;
      cursor: pointer;
      font-weight: 800;
      outline: none;
      transition: all 0.15s ease;
      touch-action: manipulation;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    }

    .btn-action.btn-refresh-only {
      width: 32px;
      height: 32px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border-radius: 10px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-action.btn-refresh-only:active {
      transform: scale(0.92);
      background: rgba(226, 232, 240, 0.8);
    }

    /* 🅿️ 3행: 주차장 메인 보드 (쾌적한 스케일과 여백) */
    .board-stage {
      width: 86vw;
      max-width: min(80vw, 340px, calc(100dvh - 250px));
      aspect-ratio: 1 / 1;
      margin: 4px auto;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .board-outer {
      width: 100%;
      height: 100%;
      background: #cbd5e1;
      border: 3px solid #94a3b8;
      border-radius: 18px;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.06);
      position: relative;
      padding: 5px;
    }

    /* 🚪 출구 게이트 (우측 2행 출구 안내) */
    .exit-gate {
      position: absolute;
      right: -28px;
      top: 33.333%;
      height: 16.666%;
      width: 28px;
      background: linear-gradient(90deg, #10b981, #059669);
      border-radius: 0 8px 8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
      z-index: 5;
      animation: pulse-exit 1.6s infinite ease-in-out;
    }
    @keyframes pulse-exit {
      0%, 100% { transform: scaleX(1); filter: brightness(1); }
      50% { transform: scaleX(1.08); filter: brightness(1.2); }
    }
    .exit-gate-text {
      color: white;
      font-size: 9px;
      font-weight: 900;
      transform: rotate(90deg);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* 🏁 보드 내부 그리드 */
    .board-grid {
      width: 100%;
      height: 100%;
      background: #f1f5f9;
      background-image: 
        linear-gradient(to right, rgba(148, 163, 184, 0.25) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.25) 1px, transparent 1px);
      background-size: 16.666% 16.666%;
      border-radius: 12px;
      position: relative;
      touch-action: none;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    /* 🚗 개별 차량 요소 (6px 내부 여백 반영) */
    .vehicle {
      position: absolute;
      border-radius: 10px;
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3px;
      transition: transform 0.08s ease, box-shadow 0.15s ease;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      box-sizing: border-box;
      z-index: 10;
    }
    .vehicle.dragging {
      cursor: grabbing;
      z-index: 50;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.6);
      transform: scale(1.02);
    }
    .vehicle.bus-len {
      border-radius: 12px;
    }

    /* ⭐ 주인공 탈출 차량 (Hero Gold & Crimson Flame 독보적 스타일) */
    .vehicle.vehicle-target {
      background: linear-gradient(135deg, #f59e0b, #ea580c) !important;
      border: 2px solid #fed7aa !important;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.8) !important;
      z-index: 15;
    }
    .vehicle.vehicle-target.dragging {
      box-shadow: 0 10px 25px rgba(234, 88, 12, 0.6) !important;
    }

    .car-front {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1px 3px;
    }
    .headlight {
      width: 5px;
      height: 5px;
      background: #fef08a;
      border-radius: 50%;
      box-shadow: 0 0 5px #fef08a;
    }
    .vehicle-target .headlight {
      width: 6px;
      height: 6px;
      background: #ffffff;
      box-shadow: 0 0 8px #67e8f9;
    }

    .car-cabin {
      flex: 1;
      width: 82%;
      background: rgba(15, 23, 42, 0.35);
      border-radius: 6px;
      margin: 1px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      position: relative;
      overflow: hidden;
    }
    .vehicle-target .car-cabin {
      background: rgba(15, 23, 42, 0.45);
      border: 1px solid rgba(254, 215, 170, 0.6);
    }

    .roof-stripe {
      position: absolute;
      top: 0; bottom: 0;
      left: calc(50% - 1.5px);
      width: 3px;
      background: rgba(255, 255, 255, 0.4);
    }
    .vehicle.horizontal .roof-stripe {
      left: 0; right: 0;
      top: calc(50% - 1.5px);
      width: 100%;
      height: 3px;
    }
    .target-badge {
      font-size: 9px;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 0 4px rgba(0,0,0,0.8);
      z-index: 2;
    }

    .car-rear {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1px 3px;
    }
    .taillight {
      width: 5px;
      height: 4px;
      background: #ef4444;
      border-radius: 2px;
      box-shadow: 0 0 4px #ef4444;
    }

    .vehicle.horizontal {
      flex-direction: row;
      padding: 3px 1px;
    }
    .vehicle.horizontal .car-front {
      width: auto;
      height: 100%;
      flex-direction: column;
      padding: 3px 1px;
      order: 3;
    }
    .vehicle.horizontal .car-cabin {
      height: 82%;
      width: auto;
      margin: 0 1px;
      order: 2;
    }
    .vehicle.horizontal .car-rear {
      width: auto;
      height: 100%;
      flex-direction: column;
      padding: 3px 1px;
      order: 1;
    }

    .vehicle.hint-highlight {
      animation: hint-glow 0.8s infinite alternate !important;
      border: 2px solid #8b5cf6 !important;
    }
    @keyframes hint-glow {
      from { box-shadow: 0 0 8px #8b5cf6; transform: scale(1); }
      to { box-shadow: 0 0 20px #a855f7; transform: scale(1.05); }
    }

    /* 🕹️ 4행: 하단 컨트롤 버튼 바 (스도쿠 4열 스타일) */
    .controls-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 4px;
    }
    .btn-action {
      padding: 9px 4px;
      font-size: 12px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.85);
      color: #334155;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn-action:active {
      transform: scale(0.95);
      background: rgba(226, 232, 240, 0.8);
    }
    .btn-action.btn-hint-style {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      border: none;
      box-shadow: 0 3px 8px rgba(139, 92, 246, 0.3);
    }
    .btn-action.btn-primary-style {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      border: none;
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3);
    }

    /* 🎉 클리어 모달 */
    .modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 16, 27, 0.7);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-box {
      background: white;
      width: 90%;
      max-width: 380px;
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-backdrop.open .modal-box {
      transform: scale(1);
    }
    .modal-emoji { font-size: 44px; margin-bottom: 8px; }
    .modal-title { font-size: 20px; font-weight: 900; color: #0f172a; margin-bottom: 4px; }
    .modal-subtitle { font-size: 13px; color: #64748b; margin-bottom: 16px; }
    .modal-stats-grid {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 18px;
    }
    .modal-stat-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .modal-stat-label { font-size: 11px; font-weight: 800; color: #64748b; }
    .modal-stat-val { font-size: 15px; font-weight: 900; color: #0284c7; margin-top: 2px; }
    .modal-btn-row {
      display: flex;
      gap: 8px;
    }
    .modal-btn {
      flex: 1;
      padding: 12px;
      font-size: 14px;
      font-weight: 900;
      border-radius: 12px;
      border: none;
      cursor: pointer;
    }
    .modal-btn.btn-sec { background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
    .modal-btn.btn-pri { background: linear-gradient(135deg, #0284c7, #0369a1); color: white; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35); }
  </style>
</head>
<body>

  <div class="game-screen">

    <!-- 🏷️ 1행: 최상단 네비게이션 바 -->
    <div class="top-nav">
      <button class="btn-nav icon-only" onclick="closeGameAndReturn()" title="포켓Tasks로 복귀">⬅</button>
      <div class="header-title"><span>🚌</span> <span>Bus Parking</span></div>
      <div class="top-nav-right">
        <button class="btn-nav icon-only" id="btnSound" onclick="toggleSound()">🔊</button>
      </div>
    </div>

    <!-- 🕹️ 2행: 스도쿠 패밀리룩 일체형 정보 바구니 -->
    <div class="game-info-bar">
      <div class="info-stat-pill">
        <span>이동:</span>
        <b id="statMoves" style="color:#0284c7;">0</b>/<span id="statOptMoves" style="color:#64748b;">8</span>
      </div>

      <div class="info-stat-pill">
        <span id="statStars" style="color:#f59e0b; letter-spacing:1px;">★★★</span>
      </div>

      <div class="info-stat-pill">
        <span id="statTime">00:00</span>
      </div>

      <select id="diffSelect" onchange="selectDifficulty(this.value)">
        <option value="NORMAL">🟢 보통</option>
        <option value="HARD">🟡 어려움</option>
        <option value="HELL">🔴 지옥</option>
      </select>

      <button class="btn-action btn-refresh-only" onclick="restartLevel()" title="다시하기">🔄</button>
    </div>

    <!-- 🅿️ 3행: 주차장 메인 보드 (여백이 살아있는 6x6 그리드) -->
    <div class="board-stage">
      <div class="board-outer" id="boardOuter">
        <div class="exit-gate" id="exitGate">
          <span class="exit-gate-text">EXIT ➔</span>
        </div>
        <div class="board-grid" id="boardGrid">
          <!-- 차량 렌더링 -->
        </div>
      </div>
    </div>

    <!-- 🕹️ 4행: 하단 컨트롤 버튼 바 (스도쿠 규격과 일치) -->
    <div class="controls-grid">
      <button class="btn-action" onclick="undoMove()">↩️ 실행취소</button>
      <button class="btn-action btn-hint-style" onclick="giveHint()">💡 힌트</button>
      <button class="btn-action" onclick="restartLevel()">🔄 초기화</button>
      <button class="btn-action btn-primary-style" onclick="loadNewLevel()">🎲 새 게임</button>
    </div>

  </div>

  <!-- 🎉 클리어 모달 -->
  <div class="modal-backdrop" id="clearModal">
    <div class="modal-box">
      <div class="modal-emoji">🎉</div>
      <div class="modal-title">주차 탈출 성공!</div>
      <div class="modal-subtitle" id="modalSubTitle">완벽한 두뇌 플레이로 길을 열었습니다!</div>

      <div class="modal-stats-grid">
        <div class="modal-stat-col">
          <span class="modal-stat-label">이동 횟수</span>
          <span class="modal-stat-val" id="modalMoves">8회</span>
        </div>
        <div class="modal-stat-col">
          <span class="modal-stat-label">최단 기록</span>
          <span class="modal-stat-val" id="modalOptMoves">8회</span>
        </div>
        <div class="modal-stat-col">
          <span class="modal-stat-label">획득 경험치</span>
          <span class="modal-stat-val" id="modalXp" style="color:#10b981;">+30 XP</span>
        </div>
      </div>

      <div class="modal-btn-row">
        <button class="modal-btn btn-sec" onclick="closeGameAndReturn()">메인으로</button>
        <button class="modal-btn btn-pri" onclick="nextLevel()">다음 맵 ➔</button>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // 🔊 사운드 & 햅틱 피드백 엔진
    // ========================================================
    let isSoundOn = true;
    let sessionTotalEarnedXp = 0;

    const SoundEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      },
      playMove() {
        if (!isSoundOn) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playHorn() {
        if (!isSoundOn) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [440, 554].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        });
      },
      playVictory() {
        if (!isSoundOn) return;
        this.init();
        if (!this.ctx) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = this.ctx.currentTime + idx * 0.1;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.22, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        });
      }
    };

    function toggleSound() {
      isSoundOn = !isSoundOn;
      const btn = document.getElementById('btnSound');
      if (btn) btn.innerText = isSoundOn ? "🔊" : "🔇";
    }

    function triggerHaptic(ms = 20) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    // ========================================================
    // 🧠 초고속 BFS 솔버 엔진
    // ========================================================
    class BusParkingSolver {
      constructor(size = 6, exitRow = 2) {
        this.size = size;
        this.exitRow = exitRow;
      }

      solve(vehicles) {
        const serialize = (vList) => vList.map(v => `${v.id}:${v.x},${v.y}`).sort().join('|');
        const startKey = serialize(vehicles);
        const queue = [{ state: vehicles, moves: 0, path: [] }];
        const visited = new Set([startKey]);

        let statesExplored = 0;
        while (queue.length > 0 && statesExplored < 50000) {
          statesExplored++;
          const current = queue.shift();
          const currVehicles = current.state;
          const currTarget = currVehicles.find(v => v.type === 'target');

          // 탈출 조건: 탈출 버스가 출구 벽에 도달
          if (currTarget.isHorizontal && currTarget.x + currTarget.len === this.size && currTarget.y === this.exitRow) {
            return {
              solvable: true,
              minMoves: current.moves + 1,
              path: current.path
            };
          }

          const grid = Array(this.size).fill(0).map(() => Array(this.size).fill(null));
          for (let v of currVehicles) {
            for (let i = 0; i < v.len; i++) {
              const vx = v.isHorizontal ? v.x + i : v.x;
              const vy = v.isHorizontal ? v.y : v.y + i;
              if (vy >= 0 && vy < this.size && vx >= 0 && vx < this.size) {
                grid[vy][vx] = v.id;
              }
            }
          }

          for (let i = 0; i < currVehicles.length; i++) {
            const v = currVehicles[i];

            if (v.isHorizontal) {
              for (let step = 1; v.x - step >= 0; step++) {
                if (grid[v.y][v.x - step] !== null) break;
                const nextVehicles = currVehicles.map(item => ({ ...item }));
                nextVehicles[i].x -= step;
                const key = serialize(nextVehicles);
                if (!visited.has(key)) {
                  visited.add(key);
                  queue.push({
                    state: nextVehicles,
                    moves: current.moves + 1,
                    path: [...current.path, { id: v.id, dir: 'left', steps: step }]
                  });
                }
              }
              for (let step = 1; v.x + v.len - 1 + step < this.size; step++) {
                if (grid[v.y][v.x + v.len - 1 + step] !== null) break;
                const nextVehicles = currVehicles.map(item => ({ ...item }));
                nextVehicles[i].x += step;
                const key = serialize(nextVehicles);
                if (!visited.has(key)) {
                  visited.add(key);
                  queue.push({
                    state: nextVehicles,
                    moves: current.moves + 1,
                    path: [...current.path, { id: v.id, dir: 'right', steps: step }]
                  });
                }
              }
            } else {
              for (let step = 1; v.y - step >= 0; step++) {
                if (grid[v.y - step][v.x] !== null) break;
                const nextVehicles = currVehicles.map(item => ({ ...item }));
                nextVehicles[i].y -= step;
                const key = serialize(nextVehicles);
                if (!visited.has(key)) {
                  visited.add(key);
                  queue.push({
                    state: nextVehicles,
                    moves: current.moves + 1,
                    path: [...current.path, { id: v.id, dir: 'up', steps: step }]
                  });
                }
              }
              for (let step = 1; v.y + v.len - 1 + step < this.size; step++) {
                if (grid[v.y + v.len - 1 + step][v.x] !== null) break;
                const nextVehicles = currVehicles.map(item => ({ ...item }));
                nextVehicles[i].y += step;
                const key = serialize(nextVehicles);
                if (!visited.has(key)) {
                  visited.add(key);
                  queue.push({
                    state: nextVehicles,
                    moves: current.moves + 1,
                    path: [...current.path, { id: v.id, dir: 'down', steps: step }]
                  });
                }
              }
            }
          }
        }

        return { solvable: false };
      }
    }

    // ========================================================
    // 🎮 게임 상태 및 렌더링 엔진
    // ========================================================
    let currentDifficulty = 'NORMAL';
    let currentLevelIndex = 0;
    let currentLevelData = null;
    let vehicles = [];
    let moveHistory = [];
    let moveCount = 0;
    let minMoves = 8;
    let isGameCleared = false;
    let timerInterval = null;
    let secondsElapsed = 0;

    const solver = new BusParkingSolver(6, 2);

    function initGame() {
      selectDifficulty('NORMAL');
    }

    function selectDifficulty(diff) {
      currentDifficulty = diff;
      const sel = document.getElementById('diffSelect');
      if (sel) sel.value = diff;

      currentLevelIndex = 0;
      loadLevel();
    }

    function loadLevel() {
      const pool = VERIFIED_LEVEL_POOLS[currentDifficulty] || VERIFIED_LEVEL_POOLS.NORMAL;
      currentLevelData = pool[currentLevelIndex % pool.length];

      vehicles = JSON.parse(JSON.stringify(currentLevelData.vehicles));
      moveHistory = [];
      moveCount = 0;
      isGameCleared = false;
      minMoves = currentLevelData.minMoves || 8;

      if (timerInterval) clearInterval(timerInterval);
      secondsElapsed = 0;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();
      }, 1000);

      updateStatsUI();
      renderBoard();

      document.getElementById('clearModal').classList.remove('open');
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      const el = document.getElementById('statTime');
      if (el) el.innerText = `${m}:${s}`;
    }

    function updateStatsUI() {
      const movesEl = document.getElementById('statMoves');
      const optEl = document.getElementById('statOptMoves');
      const starsEl = document.getElementById('statStars');

      if (movesEl) movesEl.innerText = String(moveCount);
      if (optEl) optEl.innerText = String(minMoves);

      let stars = '★★★';
      if (moveCount > minMoves + 5) stars = '★☆☆';
      else if (moveCount > minMoves + 2) stars = '★★☆';

      if (starsEl) starsEl.innerText = stars;
    }

    function renderBoard() {
      const grid = document.getElementById('boardGrid');
      if (!grid) return;
      grid.innerHTML = '';

      const size = currentLevelData.size || 6;

      vehicles.forEach(v => {
        const el = document.createElement('div');
        el.className = `vehicle ${v.isHorizontal ? 'horizontal' : 'vertical'} ${v.len === 3 ? 'bus-len' : ''} ${v.type === 'target' ? 'vehicle-target' : ''}`;
        el.dataset.id = v.id;

        // 6px 내부 여백(Gutter) 반영하여 쾌적한 배치
        const leftPct = (v.x / size) * 100;
        const topPct = (v.y / size) * 100;
        const widthPct = (v.isHorizontal ? (v.len / size) : (1 / size)) * 100;
        const heightPct = (v.isHorizontal ? (1 / size) : (v.len / size)) * 100;

        el.style.left = `calc(${leftPct}% + 3px)`;
        el.style.top = `calc(${topPct}% + 3px)`;
        el.style.width = `calc(${widthPct}% - 6px)`;
        el.style.height = `calc(${heightPct}% - 6px)`;

        if (v.type !== 'target') {
          el.style.backgroundColor = v.color || '#38bdf8';
        }

        el.innerHTML = `
          <div class="car-front">
            <div class="headlight"></div>
            <div class="headlight"></div>
          </div>
          <div class="car-cabin">
            <div class="roof-stripe"></div>
            ${v.type === 'target' ? '<span class="target-badge">⭐ ESCAPE</span>' : ''}
          </div>
          <div class="car-rear">
            <div class="taillight"></div>
            <div class="taillight"></div>
          </div>
        `;

        attachDragEvents(el, v);
        grid.appendChild(el);
      });
    }

    // ========================================================
    // 👆 터치 & 마우스 드래그 물리 엔진
    // ========================================================
    function attachDragEvents(element, vehicle) {
      let startX = 0, startY = 0;
      let initialVehiclePos = 0;
      let maxForward = 0, maxBackward = 0;
      let isDragging = false;
      let hasMoved = false;

      const onStart = (clientX, clientY) => {
        if (isGameCleared) return;
        isDragging = true;
        hasMoved = false;
        startX = clientX;
        startY = clientY;
        initialVehiclePos = vehicle.isHorizontal ? vehicle.x : vehicle.y;

        calculateMoveBounds(vehicle);

        element.classList.add('dragging');
        SoundEngine.playMove();
        triggerHaptic(15);
      };

      const onMove = (clientX, clientY) => {
        if (!isDragging) return;
        const grid = document.getElementById('boardGrid');
        const rect = grid.getBoundingClientRect();
        const cellSize = rect.width / 6;

        const deltaPx = vehicle.isHorizontal ? (clientX - startX) : (clientY - startY);
        let deltaSteps = deltaPx / cellSize;

        if (deltaSteps > maxForward) deltaSteps = maxForward;
        if (deltaSteps < -maxBackward) deltaSteps = -maxBackward;

        if (Math.abs(deltaSteps) > 0.05) hasMoved = true;

        const offsetPx = deltaSteps * cellSize;
        if (vehicle.isHorizontal) {
          element.style.transform = `translateX(${offsetPx}px)`;
        } else {
          element.style.transform = `translateY(${offsetPx}px)`;
        }
      };

      const onEnd = (clientX, clientY) => {
        if (!isDragging) return;
        isDragging = false;
        element.classList.remove('dragging');
        element.style.transform = '';

        const grid = document.getElementById('boardGrid');
        const rect = grid.getBoundingClientRect();
        const cellSize = rect.width / 6;

        const deltaPx = vehicle.isHorizontal ? (clientX - startX) : (clientY - startY);
        let deltaSteps = Math.round(deltaPx / cellSize);

        if (deltaSteps > maxForward) deltaSteps = maxForward;
        if (deltaSteps < -maxBackward) deltaSteps = -maxBackward;

        if (deltaSteps !== 0) {
          moveHistory.push({
            id: vehicle.id,
            fromX: vehicle.x,
            fromY: vehicle.y,
            toX: vehicle.isHorizontal ? vehicle.x + deltaSteps : vehicle.x,
            toY: vehicle.isHorizontal ? vehicle.y : vehicle.y + deltaSteps
          });

          if (vehicle.isHorizontal) {
            vehicle.x += deltaSteps;
          } else {
            vehicle.y += deltaSteps;
          }

          moveCount++;
          SoundEngine.playMove();
          triggerHaptic(20);
          updateStatsUI();
          renderBoard();

          checkVictoryCondition();
        }
      };

      function calculateMoveBounds(currV) {
        const grid = Array(6).fill(0).map(() => Array(6).fill(null));
        vehicles.forEach(v => {
          if (v.id === currV.id) return;
          for (let i = 0; i < v.len; i++) {
            const vx = v.isHorizontal ? v.x + i : v.x;
            const vy = v.isHorizontal ? v.y : v.y + i;
            if (vy >= 0 && vy < 6 && vx >= 0 && vx < 6) grid[vy][vx] = v.id;
          }
        });

        maxForward = 0;
        maxBackward = 0;

        if (currV.isHorizontal) {
          for (let x = currV.x - 1; x >= 0; x--) {
            if (grid[currV.y][x] === null) maxBackward++;
            else break;
          }
          for (let x = currV.x + currV.len; x < 6; x++) {
            if (grid[currV.y][x] === null) maxForward++;
            else break;
          }
        } else {
          for (let y = currV.y - 1; y >= 0; y--) {
            if (grid[y][currV.x] === null) maxBackward++;
            else break;
          }
          for (let y = currV.y + currV.len; y < 6; y++) {
            if (grid[y][currV.x] === null) maxForward++;
            else break;
          }
        }
      }

      element.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        onStart(e.clientX, e.clientY);

        const onPointerMove = (moveEvent) => {
          onMove(moveEvent.clientX, moveEvent.clientY);
        };
        const onPointerUp = (upEvent) => {
          onEnd(upEvent.clientX, upEvent.clientY);
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      });
    }

    // ========================================================
    // 🏆 승리 판정 및 보상 지급
    // ========================================================
    function checkVictoryCondition() {
      const target = vehicles.find(v => v.type === 'target');
      if (target && target.isHorizontal && target.x + target.len === 6 && target.y === 2) {
        isGameCleared = true;
        if (timerInterval) clearInterval(timerInterval);

        SoundEngine.playHorn();
        setTimeout(() => SoundEngine.playVictory(), 200);
        triggerHaptic(50);

        let rewardXp = 30;
        if (moveCount > minMoves + 5) rewardXp = 15;
        else if (moveCount > minMoves + 2) rewardXp = 20;

        sessionTotalEarnedXp += rewardXp;

        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: 'GAME_SESSION_CLEAR',
              gameType: 'bus_parking',
              gameName: 'Bus Parking',
              rewardXp: rewardXp,
              totalXp: sessionTotalEarnedXp,
              moves: moveCount,
              difficulty: currentDifficulty
            }, '*');
          }
          localStorage.setItem('BUS_PARKING_PENDING_XP', String(sessionTotalEarnedXp));
        } catch(e) {}

        setTimeout(() => {
          document.getElementById('modalMoves').innerText = `${moveCount}회`;
          document.getElementById('modalOptMoves').innerText = `${minMoves}회`;
          document.getElementById('modalXp').innerText = `+${rewardXp} XP`;
          document.getElementById('clearModal').classList.add('open');
        }, 400);
      }
    }

    // ========================================================
    // 💡 힌트 & 조작 액션
    // ========================================================
    function undoMove() {
      if (moveHistory.length === 0 || isGameCleared) return;
      const last = moveHistory.pop();
      const v = vehicles.find(item => item.id === last.id);
      if (v) {
        v.x = last.fromX;
        v.y = last.fromY;
        moveCount = Math.max(0, moveCount - 1);
        updateStatsUI();
        renderBoard();
        SoundEngine.playMove();
        triggerHaptic(15);
      }
    }

    function giveHint() {
      if (isGameCleared) return;
      const res = solver.solve(vehicles);
      if (res.solvable && res.path && res.path.length > 0) {
        const nextAction = res.path[0];
        const el = document.querySelector(`.vehicle[data-id="${nextAction.id}"]`);
        if (el) {
          el.classList.add('hint-highlight');
          triggerHaptic(30);
          setTimeout(() => el.classList.remove('hint-highlight'), 1800);
        }
      }
    }

    function restartLevel() {
      loadLevel();
    }

    function loadNewLevel() {
      currentLevelIndex++;
      loadLevel();
    }

    function nextLevel() {
      currentLevelIndex++;
      loadLevel();
    }

    // ========================================================
    // 🚪 포켓Tasks로 복귀
    // ========================================================
    function closeGameAndReturn() {
      try {
        if (typeof saveCurrentGame === 'function') saveCurrentGame(false);
        if (typeof saveCurrentStage === 'function') saveCurrentStage(false);
        if (typeof saveCurrentFullStage === 'function') saveCurrentFullStage(false);
      } catch(e) {}

      const xp = (typeof sessionTotalEarnedXp !== 'undefined') ? sessionTotalEarnedXp : 0;
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'CLOSE_ARCADE_GAME', gameType: 'bus_parking', gameName: 'Bus Parking', totalXp: xp }, '*');
        }
      } catch(e) {}
      try {
        if (window.top && window.top !== window) {
          window.top.postMessage({ type: 'CLOSE_ARCADE_GAME', gameType: 'bus_parking', gameName: 'Bus Parking', totalXp: xp }, '*');
        }
      } catch(e) {}

      if (window.parent === window && window.top === window) {
        window.location.replace('./index.html?rewardXp=' + xp);
      }
    }

    window.onload = initGame;
  </script>
