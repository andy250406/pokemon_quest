<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🚌 버스 주차 탈출 (Bus Parking Jam) - 포켓Tasks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <meta name="theme-color" content="#090d16">

  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #090d16;
      color: #f8fafc;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: env(safe-area-inset-top, 6px) 10px env(safe-area-inset-bottom, 10px) 10px;
    }

    /* 🧭 상단 네비 & 타이틀 */
    .game-header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 6px 4px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-back:active { background: rgba(255, 255, 255, 0.25); }

    .game-title {
      font-size: 16px;
      font-weight: 900;
      color: #fde047;
      text-shadow: 0 0 10px rgba(253, 224, 71, 0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 🎛️ 난이도 선택 탭 바 */
    .diff-selector {
      width: 100%;
      max-width: 480px;
      display: flex;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 3px;
      margin-bottom: 6px;
    }

    .diff-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 800;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .diff-btn.active {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.45);
    }
    .diff-btn.diff-hard.active {
      background: linear-gradient(135deg, #d97706, #b45309);
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.45);
    }
    .diff-btn.diff-hell.active {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      box-shadow: 0 2px 8px rgba(220, 38, 38, 0.45);
    }

    /* 📊 실시간 스탯 바 */
    .stats-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 7px 14px;
      margin-bottom: 6px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .stat-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
    }
    .stat-val {
      font-size: 14px;
      font-weight: 900;
      color: #f8fafc;
    }
    .stat-val.highlight {
      color: #38bdf8;
    }

    .star-grade {
      display: flex;
      gap: 2px;
      font-size: 13px;
      color: #fde047;
    }

    /* 🅿️ 큼직하고 시원한 주차장 메인 보드 */
    .board-stage {
      position: relative;
      width: 96vw;
      max-width: min(94vw, 470px, calc(100dvh - 195px));
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    .board-outer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #111827;
      border: 4px solid #334155;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 25px rgba(0, 0, 0, 0.9);
      padding: 8px;
      touch-action: none;
      overflow: visible;
    }

    /* 🚧 우측 출구 게이트 (EXIT) */
    .exit-gate {
      position: absolute;
      right: -22px;
      width: 24px;
      background: linear-gradient(135deg, #22c55e, #15803d);
      border: 2px solid #86efac;
      border-radius: 0 8px 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.7);
      animation: pulse-exit 1.4s infinite alternate;
      z-index: 15;
    }
    @keyframes pulse-exit {
      from { box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); transform: scale(1); }
      to { box-shadow: 0 0 20px rgba(34, 197, 94, 0.95); transform: scale(1.05); }
    }
    .exit-gate-text {
      writing-mode: vertical-rl;
      font-size: 8.5px;
      font-weight: 900;
      color: white;
      letter-spacing: 1px;
    }

    /* 🏁 그리드 바닥판 */
    .board-grid {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0b1120;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      border-radius: 10px;
      overflow: visible;
    }

    /* 🚗 현실감 넘치는 탑뷰 차량 공통 스타일 */
    .vehicle {
      position: absolute;
      border-radius: 10px;
      cursor: grab;
      touch-action: none;
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.35);
      transition: transform 0.08s ease-out, box-shadow 0.15s;
      padding: 2px;
      display: flex;
    }
    .vehicle:active, .vehicle.dragging {
      cursor: grabbing;
      z-index: 25;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7), 0 0 15px rgba(255, 255, 255, 0.4);
      filter: brightness(1.12);
    }

    /* 🚌 주인공 탈출 버스 특별 스타일 */
    .vehicle.target-vehicle {
      background: linear-gradient(135deg, #facc15, #eab308) !important;
      border: 2px solid #fef08a !important;
      box-shadow: 0 4px 16px rgba(250, 204, 21, 0.6), inset 0 2px 4px rgba(255, 255, 255, 0.7) !important;
      z-index: 12;
    }

    /* 🚗 2D 탑뷰 차량 그래픽 디테일 (헤드라이트, 유리창, 루프, 후미등) */
    .vehicle-body {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
    }

    /* 가로 차량 (수평: 좌=후미등, 우=헤드라이트/전면) */
    .vehicle.horiz .vehicle-body {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
    }

    /* 세로 차량 (수직: 상=후미등, 하=헤드라이트/전면) */
    .vehicle.vert .vehicle-body {
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* 💡 헤드라이트 (전면부) */
    .headlights-box {
      display: flex;
      z-index: 3;
    }
    .vehicle.horiz .headlights-box {
      flex-direction: column;
      justify-content: space-between;
      height: 75%;
      margin-right: 2px;
    }
    .vehicle.vert .headlights-box {
      flex-direction: row;
      justify-content: space-between;
      width: 75%;
      margin-bottom: 2px;
    }

    .headlight-lamp {
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 8px #fef08a, 0 0 12px rgba(254, 240, 138, 0.9);
    }
    .vehicle.horiz .headlight-lamp { width: 4px; height: 6px; }
    .vehicle.vert .headlight-lamp { width: 6px; height: 4px; }

    /* 🔴 테일램프 / 후미등 (후면부) */
    .taillights-box {
      display: flex;
      z-index: 3;
    }
    .vehicle.horiz .taillights-box {
      flex-direction: column;
      justify-content: space-between;
      height: 75%;
      margin-left: 2px;
    }
    .vehicle.vert .taillights-box {
      flex-direction: row;
      justify-content: space-between;
      width: 75%;
      margin-top: 2px;
    }

    .taillight-lamp {
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
    }
    .vehicle.horiz .taillight-lamp { width: 3px; height: 5px; }
    .vehicle.vert .taillight-lamp { width: 5px; height: 3px; }

    /* 🪟 앞유리 & 뒷유리 & 선루프 */
    .cabin-area {
      position: absolute;
      inset: 4px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vehicle.horiz .cabin-area {
      left: 14%;
      right: 14%;
    }
    .vehicle.vert .cabin-area {
      top: 14%;
      bottom: 14%;
    }

    .windshield {
      position: absolute;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.45), rgba(56, 189, 248, 0.25));
      border-radius: 3px;
    }
    /* 가로 차량 앞유리 (우측) */
    .vehicle.horiz .windshield.front {
      right: 2px;
      top: 2px;
      bottom: 2px;
      width: 25%;
    }
    /* 가로 차량 뒷유리 (좌측) */
    .vehicle.horiz .windshield.rear {
      left: 2px;
      top: 2px;
      bottom: 2px;
      width: 18%;
    }
    /* 세로 차량 앞유리 (하단) */
    .vehicle.vert .windshield.front {
      bottom: 2px;
      left: 2px;
      right: 2px;
      height: 25%;
    }
    /* 세로 차량 뒷유리 (상단) */
    .vehicle.vert .windshield.rear {
      top: 2px;
      left: 2px;
      right: 2px;
      height: 18%;
    }

    .roof-top {
      width: 45%;
      height: 45%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.3);
    }

    /* 🎮 하단 컨트롤 버튼 바 */
    .bottom-controls {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 6px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.85);
      color: #f1f5f9;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s;
    }
    .ctrl-btn:active {
      transform: scale(0.96);
      background: rgba(51, 65, 85, 0.95);
    }
    .ctrl-btn.btn-hint {
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      border-color: #a78bfa;
      color: white;
    }
    .ctrl-btn.btn-new {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      color: white;
    }

    /* 🏆 게임 클리어 축하 모달 */
    .clear-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .clear-card {
      width: 100%;
      max-width: 350px;
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 24px;
      padding: 22px 18px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(2, 132, 199, 0.4);
    }

    .clear-stars {
      font-size: 36px;
      margin-bottom: 6px;
      letter-spacing: 4px;
      color: #fde047;
    }
    .clear-title {
      font-size: 20px;
      font-weight: 900;
      color: #fde047;
      margin-bottom: 6px;
    }
    .clear-stats {
      background: #1e293b;
      border-radius: 12px;
      padding: 10px;
      margin: 12px 0;
      font-size: 13px;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .clear-reward {
      font-size: 16px;
      font-weight: 900;
      color: #38bdf8;
      margin-bottom: 16px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px dashed #38bdf8;
      padding: 9px;
      border-radius: 12px;
    }

    .clear-btn-group {
      display: flex;
      gap: 8px;
    }
    .clear-btn {
      flex: 1;
      padding: 11px 0;
      border: none;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
    }
    .clear-btn.next {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
    }
    .clear-btn.restart {
      background: #334155;
      color: #f1f5f9;
    }

    /* 💡 힌트 연출 */
    .vehicle.hint-highlight {
      animation: hint-glow 0.8s infinite alternate !important;
      border: 2px solid #c084fc !important;
    }
    @keyframes hint-glow {
      from { box-shadow: 0 0 8px #a855f7; transform: scale(1); }
      to { box-shadow: 0 0 20px #c084fc; transform: scale(1.06); }
    }
  </style>
</head>
<body>

  <!-- 🧭 헤더 -->
  <div class="game-header">
    <button class="btn-back" onclick="exitToArcade()">⬅ 목록</button>
    <div class="game-title"><span>🚌</span> <span>버스 주차 탈출</span></div>
    <div style="width: 55px;"></div>
  </div>

  <!-- 🎛️ 난이도 선택 -->
  <div class="diff-selector">
    <button class="diff-btn active" id="btnDiffNormal" onclick="selectDifficulty('NORMAL')">🟢 보통 (6x6)</button>
    <button class="diff-btn diff-hard" id="btnDiffHard" onclick="selectDifficulty('HARD')">🟡 어려움 (6x6)</button>
    <button class="diff-btn diff-hell" id="btnDiffHell" onclick="selectDifficulty('HELL')">🔴 지옥 (6x6)</button>
  </div>

  <!-- 📊 실시간 스탯 바 -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-label">현재 이동</span>
      <span class="stat-val highlight" id="statMoves">0회</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">최단 목표</span>
      <span class="stat-val" id="statOptMoves">-회</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">현재 평가</span>
      <div class="star-grade" id="statStars">★★★</div>
    </div>
    <div class="stat-item">
      <span class="stat-label">집중 시간</span>
      <span class="stat-val" id="statTime">00:00</span>
    </div>
  </div>

  <!-- 🅿️ 큼직한 주차장 메인 보드 -->
  <div class="board-stage">
    <div class="board-outer" id="boardOuter">
      <div class="exit-gate" id="exitGate">
        <span class="exit-gate-text">EXIT ➔</span>
      </div>
      <div class="board-grid" id="boardGrid">
        <!-- 차량들이 백분율 좌표로 100% 정밀 렌더링됩니다 -->
      </div>
    </div>
  </div>

  <!-- 🎮 하단 컨트롤 버튼 바 -->
  <div class="bottom-controls">
    <button class="ctrl-btn" onclick="undoMove()">↩️ 되돌리기</button>
    <button class="ctrl-btn btn-hint" onclick="giveHint()">💡 힌트</button>
    <button class="ctrl-btn" onclick="restartLevel()">🔄 다시하기</button>
    <button class="ctrl-btn btn-new" onclick="loadNewLevel()">🎲 새 맵</button>
  </div>

  <!-- 🏆 클리어 모달 -->
  <div class="clear-modal" id="clearModal">
    <div class="clear-card">
      <div class="clear-stars" id="modalStars">★★★</div>
      <div class="clear-title">주차 탈출 성공! 🎉</div>
      <div class="clear-stats">
        <div>내 이동 수: <b id="modalUserMoves" style="color:#fde047;">0</b>회</div>
        <div>최단 이동 수: <b id="modalOptMoves" style="color:#38bdf8;">0</b>회</div>
        <div>소요 시간: <b id="modalTime" style="color:#e2e8f0;">00:00</b></div>
      </div>
      <div class="clear-reward" id="modalRewardText">
        🎁 포켓몬 경험치 +40 XP 획득!
      </div>
      <div class="clear-btn-group">
        <button class="clear-btn restart" onclick="restartLevel()">다시 도전 🔄</button>
        <button class="clear-btn next" onclick="loadNewLevel()">다음 스테이지 ➡️</button>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // 🎵 Web Audio API 효과음 생성기
    // ========================================================
    const SoundFX = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
      },
      playMove() {
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      playHorn() {
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [440, 554].forEach(freq => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.45);
        });
      },
      playVictory() {
        this.init();
        if (!this.ctx) return;
        const notes = [261.63, 329.63, 392.00, 523.25];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const t = this.ctx.currentTime + idx * 0.1;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.25, t);
          gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        });
      }
    };

    function triggerHaptic(ms = 20) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (e) {}
      }
    }

    // ========================================================
    // 🧠 초고속 BFS 솔버 엔진
    // ========================================================
    class BusParkingSolver {
      constructor(size = 6, exitRow = 2) {
        this.size = size;
        this.exitRow = exitRow;
      }

      solve(vehicles) {
        const serialize = (vList) => vList.map(v => `${v.id}:${v.x},${v.y}`).sort().join('|');
        const startKey = serialize(vehicles);
        const queue = [{ state: vehicles, moves: 0, path: [] }];
        const visited = new Set([startKey]);

        let statesExplored = 0;
        while (queue.length > 0 && statesExplored < 50000) {
          statesExplored++;
          const current = queue.shift();
          const currVehicles = current.state;
          const currTarget = currVehicles.find(v => v.type === 'target');

          // 탈출 조건: 탈출 버스가 출구 벽에 완전히 도달
          if (currTarget.isHorizontal && currTarget.x + currTarget.len === this.size && currTarget.y === this.exitRow) {
            return {
              solvable: true,
              minMoves: current.moves + 1,
              path: current.path
            };
          }

          const grid = Array(this.size).fill(0).map(() => Array(this.size).fill(null));
          for (let v of currVehicles) {
            for (let i = 0; i < v.len; i++) {
              const vx = v.isHorizontal ? v.x + i : v.x;
              const vy = v.isHorizontal ? v.y : v.y + i;
              if (vy >= 0 && vy < this.size && vx >= 0 && vx < this.size) {
                grid[vy][vx] = v.id;
              }
            }
          }

          for (let i = 0; i < currVehicles.length; i++) {
            const v = currVehicles[i];

            if (v.isHorizontal) {
              for (let step = 1; v.x - step >= 0; step++) {
                if (grid[v.y][v.x - step] !== null) break;
                const nextVehicles = currVehicles.map(item => ({ ...item }));
                nextVehicles[i].x -= step;
                const key = serialize(nextVehicles);
                if (!visited.has(key)) {
                  visited.add(key);
                  queue.push({
                    state: nextVehicles,
                    moves: current.moves + 1,
                    path: [...current.path, { id: v.id, dir: 'left', steps: step }]
                  });
                }
              }
              for (let step = 1; v.x + v.len - 1 + step < this.size; step++) {
                if (grid[v.y][v.x + v.len - 1 + step] !== null) break;
                const nextVehicles = currVehicles.map(item => ({ ...item }));
                nextVehicles[i].x += step;
                const key = serialize(nextVehicles);
                if (!visited.has(key)) {
                  visited.add(key);
                  queue.push({
                    state: nextVehicles,
                    moves: current.moves + 1,
                    path: [...current.path, { id: v.id, dir: 'right', steps: step }]
                  });
                }
              }
            } else {
              for (let step = 1; v.y - step >= 0; step++) {
                if (grid[v.y - step][v.x] !== null) break;
                const nextVehicles = currVehicles.map(item => ({ ...item }));
                nextVehicles[i].y -= step;
                const key = serialize(nextVehicles);
                if (!visited.has(key)) {
                  visited.add(key);
                  queue.push({
                    state: nextVehicles,
                    moves: current.moves + 1,
                    path: [...current.path, { id: v.id, dir: 'up', steps: step }]
                  });
                }
              }
              for (let step = 1; v.y + v.len - 1 + step < this.size; step++) {
                if (grid[v.y + v.len - 1 + step][v.x] !== null) break;
                const nextVehicles = currVehicles.map(item => ({ ...item }));
                nextVehicles[i].y += step;
                const key = serialize(nextVehicles);
                if (!visited.has(key)) {
                  visited.add(key);
                  queue.push({
                    state: nextVehicles,
                    moves: current.moves + 1,
                    path: [...current.path, { id: v.id, dir: 'down', steps: step }]
                  });
                }
              }
            }
          }
        }

        return { solvable: false };
      }

};

    // ========================================================
    // 🕹️ 게임 상태 관리
    // ========================================================
    let currentDifficulty = 'NORMAL';
    let currentLevelData = null;
    let initialVehicles = [];
    let activeVehicles = [];
    let moveHistory = [];
    let userMoveCount = 0;
    let optimalMoves = 10;
    let gameTimerId = null;
    let elapsedSeconds = 0;
    let isClear = false;

    // 드래그 상태
    let draggingVehicle = null;
    let dragStartPointer = { x: 0, y: 0 };
    let dragStartPos = { x: 0, y: 0 };
    let minAllowedCoord = 0;
    let maxAllowedCoord = 0;

    function selectDifficulty(diff) {
      currentDifficulty = diff;
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      if (diff === 'NORMAL') document.getElementById('btnDiffNormal').classList.add('active');
      else if (diff === 'HARD') document.getElementById('btnDiffHard').classList.add('active');
      else if (diff === 'HELL') document.getElementById('btnDiffHell').classList.add('active');
      loadNewLevel();
    }

    function loadNewLevel() {
      document.getElementById('clearModal').style.display = 'none';
      isClear = false;
      userMoveCount = 0;
      moveHistory = [];

      if (gameTimerId) clearInterval(gameTimerId);
      elapsedSeconds = 0;
      updateTimerDisplay();
      gameTimerId = setInterval(() => {
        if (!isClear) {
          elapsedSeconds++;
          updateTimerDisplay();
        }
      }, 1000);

      const pool = VERIFIED_LEVEL_POOLS[currentDifficulty] || VERIFIED_LEVEL_POOLS.NORMAL;
      const rawLevel = pool[Math.floor(Math.random() * pool.length)];

      currentLevelData = JSON.parse(JSON.stringify(rawLevel));
      initialVehicles = JSON.parse(JSON.stringify(currentLevelData.vehicles));
      activeVehicles = JSON.parse(JSON.stringify(currentLevelData.vehicles));
      optimalMoves = currentLevelData.minMoves || 10;

      document.getElementById('statOptMoves').innerText = `${optimalMoves}회`;
      updateStatsDisplay();
      renderBoard();
      SoundFX.playMove();
    }

    function restartLevel() {
      document.getElementById('clearModal').style.display = 'none';
      isClear = false;
      userMoveCount = 0;
      moveHistory = [];
      activeVehicles = JSON.parse(JSON.stringify(initialVehicles));
      updateStatsDisplay();
      renderBoard();
      SoundFX.playMove();
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
      const s = String(elapsedSeconds % 60).padStart(2, '0');
      document.getElementById('statTime').innerText = `${m}:${s}`;
    }

    function updateStatsDisplay() {
      document.getElementById('statMoves').innerText = `${userMoveCount}회`;

      const starsEl = document.getElementById('statStars');
      if (userMoveCount <= optimalMoves + 2) {
        starsEl.innerText = '★★★';
        starsEl.style.color = '#fde047';
      } else if (userMoveCount <= optimalMoves + 6) {
        starsEl.innerText = '★★☆';
        starsEl.style.color = '#f59e0b';
      } else {
        starsEl.innerText = '★☆☆';
        starsEl.style.color = '#94a3b8';
      }
    }

    // ========================================================
    // 🎨 정밀 백분율 보드 & 고품질 2D 탑뷰 차량 렌더링
    // ========================================================
    function renderBoard() {
      const gridEl = document.getElementById('boardGrid');
      const exitGate = document.getElementById('exitGate');
      if (!gridEl || !currentLevelData) return;

      const size = currentLevelData.size || 6;
      const exitRow = currentLevelData.exitRow || 2;

      gridEl.innerHTML = '';

      // 출구 게이트 위치 맞춤 (백분율 기반)
      const gateTopPercent = (exitRow / size) * 100;
      const gateHeightPercent = (1 / size) * 100 * 0.8;
      exitGate.style.top = `calc(${gateTopPercent}% + 4px)`;
      exitGate.style.height = `${gateHeightPercent}%`;

      // 그리드 분할 라인 배경
      const pctStep = 100 / size;
      gridEl.style.backgroundSize = `${pctStep}% ${pctStep}%`;

      // 차량 렌더링 (텍스트 없이 헤드라이트 + 유리창 + 후미등)
      activeVehicles.forEach(v => {
        const vEl = document.createElement('div');
        vEl.id = `veh_${v.id}`;
        vEl.className = `vehicle ${v.isHorizontal ? 'horiz' : 'vert'} ${v.type === 'target' ? 'target-vehicle' : ''}`;
        vEl.style.background = v.color;

        // 백분율 포지셔닝으로 1px의 오차 없이 완벽 정렬
        const leftPct = (v.x / size) * 100;
        const topPct = (v.y / size) * 100;
        const widthPct = ((v.isHorizontal ? v.len : 1) / size) * 100;
        const heightPct = ((v.isHorizontal ? 1 : v.len) / size) * 100;

        vEl.style.left = `calc(${leftPct}% + 2px)`;
        vEl.style.top = `calc(${topPct}% + 2px)`;
        vEl.style.width = `calc(${widthPct}% - 4px)`;
        vEl.style.height = `calc(${heightPct}% - 4px)`;

        vEl.innerHTML = `
          <div class="vehicle-body">
            <div class="taillights-box">
              <div class="taillight-lamp"></div>
              <div class="taillight-lamp"></div>
            </div>
            <div class="cabin-area">
              <div class="windshield rear"></div>
              <div class="roof-top"></div>
              <div class="windshield front"></div>
            </div>
            <div class="headlights-box">
              <div class="headlight-lamp"></div>
              <div class="headlight-lamp"></div>
            </div>
          </div>
        `;

        vEl.addEventListener('pointerdown', (e) => onPointerDown(e, v, vEl));
        gridEl.appendChild(vEl);
      });
    }

    // ========================================================
    // 🖐️ 터치 & 마우스 드래그 물리 엔진
    // ========================================================
    function onPointerDown(e, v, el) {
      if (isClear) return;
      e.preventDefault();
      SoundFX.init();

      draggingVehicle = v;
      dragStartPointer = { x: e.clientX, y: e.clientY };
      dragStartPos = { x: v.x, y: v.y };

      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);

      const gridEl = document.getElementById('boardGrid');
      const gridRect = gridEl.getBoundingClientRect();
      const size = currentLevelData.size;
      const cellPx = gridRect.width / size;

      // 충돌 검사용 그리드 맵
      const grid = Array(size).fill(0).map(() => Array(size).fill(null));
      activeVehicles.forEach(item => {
        if (item.id === v.id) return;
        for (let i = 0; i < item.len; i++) {
          const cx = item.isHorizontal ? item.x + i : item.x;
          const cy = item.isHorizontal ? item.y : item.y + i;
          if (cy >= 0 && cy < size && cx >= 0 && cx < size) {
            grid[cy][cx] = item.id;
          }
        }
      });

      if (v.isHorizontal) {
        let minX = v.x;
        while (minX > 0 && grid[v.y][minX - 1] === null) minX--;
        let maxX = v.x;
        while (maxX + v.len < size && grid[v.y][maxX + v.len] === null) maxX++;
        
        // 탈출 버스는 출구로 1칸 더 나갈 수 있게 허용
        if (v.type === 'target' && v.y === currentLevelData.exitRow && maxX + v.len === size) {
          maxX += 1;
        }

        minAllowedCoord = minX;
        maxAllowedCoord = maxX;
      } else {
        let minY = v.y;
        while (minY > 0 && grid[minY - 1][v.x] === null) minY--;
        let maxY = v.y;
        while (maxY + v.len < size && grid[maxY + v.len][v.x] === null) maxY++;

        minAllowedCoord = minY;
        maxAllowedCoord = maxY;
      }

      const onPointerMove = (moveEvt) => {
        if (!draggingVehicle || draggingVehicle.id !== v.id) return;
        const deltaX = moveEvt.clientX - dragStartPointer.x;
        const deltaY = moveEvt.clientY - dragStartPointer.y;

        if (v.isHorizontal) {
          const deltaCells = deltaX / cellPx;
          let targetCellX = dragStartPos.x + deltaCells;
          targetCellX = Math.max(minAllowedCoord, Math.min(maxAllowedCoord, targetCellX));
          const leftPct = (targetCellX / size) * 100;
          el.style.left = `calc(${leftPct}% + 2px)`;
        } else {
          const deltaCells = deltaY / cellPx;
          let targetCellY = dragStartPos.y + deltaCells;
          targetCellY = Math.max(minAllowedCoord, Math.min(maxAllowedCoord, targetCellY));
          const topPct = (targetCellY / size) * 100;
          el.style.top = `calc(${topPct}% + 2px)`;
        }
      };

      const onPointerUp = (upEvt) => {
        el.removeEventListener('pointermove', onPointerMove);
        el.removeEventListener('pointerup', onPointerUp);
        el.classList.remove('dragging');

        const deltaX = upEvt.clientX - dragStartPointer.x;
        const deltaY = upEvt.clientY - dragStartPointer.y;

        let finalGridX = v.x;
        let finalGridY = v.y;

        if (v.isHorizontal) {
          const deltaCells = deltaX / cellPx;
          finalGridX = Math.round(dragStartPos.x + deltaCells);
          finalGridX = Math.max(minAllowedCoord, Math.min(maxAllowedCoord, finalGridX));
        } else {
          const deltaCells = deltaY / cellPx;
          finalGridY = Math.round(dragStartPos.y + deltaCells);
          finalGridY = Math.max(minAllowedCoord, Math.min(maxAllowedCoord, finalGridY));
        }

        if (finalGridX !== dragStartPos.x || finalGridY !== dragStartPos.y) {
          moveHistory.push({
            id: v.id,
            fromX: dragStartPos.x,
            fromY: dragStartPos.y,
            toX: finalGridX,
            toY: finalGridY
          });
          v.x = finalGridX;
          v.y = finalGridY;
          userMoveCount++;
          SoundFX.playMove();
          triggerHaptic(18);
          updateStatsDisplay();
        }

        renderBoard();

        // 🏆 승리 판정
        if (v.type === 'target' && v.x + v.len >= currentLevelData.size && v.y === currentLevelData.exitRow) {
          handleGameClear();
        }

        draggingVehicle = null;
      };

      el.addEventListener('pointermove', onPointerMove);
      el.addEventListener('pointerup', onPointerUp);
    }

    // ========================================================
    // ↩️ 되돌리기 & 💡 힌트
    // ========================================================
    function undoMove() {
      if (moveHistory.length === 0 || isClear) return;
      const lastMove = moveHistory.pop();
      const v = activeVehicles.find(item => item.id === lastMove.id);
      if (v) {
        v.x = lastMove.fromX;
        v.y = lastMove.fromY;
        userMoveCount = Math.max(0, userMoveCount - 1);
        updateStatsDisplay();
        renderBoard();
        SoundFX.playMove();
        triggerHaptic(15);
      }
    }

    function giveHint() {
      if (isClear) return;
      const solver = new BusParkingSolver(currentLevelData.size, currentLevelData.exitRow);
      const res = solver.solve(activeVehicles);

      if (res && res.solvable && res.path.length > 0) {
        const nextStep = res.path[0];
        const vEl = document.getElementById(`veh_${nextStep.id}`);
        if (vEl) {
          vEl.classList.add('hint-highlight');
          SoundFX.playHorn();
          triggerHaptic(40);
          setTimeout(() => {
            vEl.classList.remove('hint-highlight');
          }, 1600);
        }
      } else {
        alert("💡 현재 상태에서는 출구가 막혀 있습니다. 되돌리기(↩️)를 사용해 보세요!");
      }
    }

    // ========================================================
    // 🏆 게임 클리어 & 포켓몬 경험치
    // ========================================================
    function handleGameClear() {
      if (isClear) return;
      isClear = true;
      if (gameTimerId) clearInterval(gameTimerId);

      SoundFX.playHorn();
      setTimeout(() => SoundFX.playVictory(), 250);
      triggerHaptic(100);

      let stars = '★☆☆';
      let earnedXp = 20;

      if (currentDifficulty === 'NORMAL') {
        if (userMoveCount <= optimalMoves + 2) { stars = '★★★'; earnedXp = 40; }
        else if (userMoveCount <= optimalMoves + 6) { stars = '★★☆'; earnedXp = 25; }
        else { stars = '★☆☆'; earnedXp = 15; }
      } else if (currentDifficulty === 'HARD') {
        if (userMoveCount <= optimalMoves + 2) { stars = '★★★'; earnedXp = 65; }
        else if (userMoveCount <= optimalMoves + 6) { stars = '★★☆'; earnedXp = 40; }
        else { stars = '★☆☆'; earnedXp = 25; }
      } else { // HELL
        if (userMoveCount <= optimalMoves + 3) { stars = '★★★'; earnedXp = 100; }
        else if (userMoveCount <= optimalMoves + 8) { stars = '★★☆'; earnedXp = 70; }
        else { stars = '★☆☆'; earnedXp = 45; }
      }

      document.getElementById('modalStars').innerText = stars;
      document.getElementById('modalUserMoves').innerText = userMoveCount;
      document.getElementById('modalOptMoves').innerText = optimalMoves;
      document.getElementById('modalTime').innerText = document.getElementById('statTime').innerText;
      document.getElementById('modalRewardText').innerText = `🎁 포켓몬 경험치 +${earnedXp} XP 획득! ✨`;
      document.getElementById('clearModal').style.display = 'flex';

      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'GAME_SESSION_CLEAR',
            gameType: 'bus_parking',
            gameName: '버스 주차 탈출',
            totalXp: earnedXp
          }, '*');
        }
        localStorage.setItem('BUS_PARKING_PENDING_XP', earnedXp);
      } catch (e) {}
    }

    function exitToArcade() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'CLOSE_ARCADE_GAME' }, '*');
      } else {
        if (window.history.length > 1) window.history.back();
        else window.location.href = './index.html';
      }
    }

    window.addEventListener('resize', () => {
      renderBoard();
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadNewLevel();
    });
  </script>
