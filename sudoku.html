<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Sudoku - 포켓Tasks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #060913; /* 🌌 아주 어두운 프리미엄 다크 네이비 */
      background-image: radial-gradient(circle at 50% 50%, #0d1527 0%, #060913 100%);
      color: #f1f5f9;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }

    /* 🎮 메인 게임 프레임 (화이트 글래스모피즘 테마) */
    .game-screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-width: 500px;
      max-height: 840px;
      background: rgba(248, 250, 252, 0.88); /* 🌟 화이트 글래스 */
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      color: #0f172a;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 10px;
      border-radius: 28px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.4);
      transition: max-width 0.3s cubic-bezier(0.4, 0, 0.2, 1), max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 💻 PC / 태블릿 가로 화면 (단독 480px 한도 프레임 & 다크 배경 액자형 UI) */
    @media (min-width: 840px) {
      .game-screen {
        max-width: 480px !important;
        height: 820px !important;
        max-height: 90vh !important;
        max-height: 90dvh !important;
        border-radius: 28px !important;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.5) !important;
      }
    }

    /* 📱 스마트폰 모바일 화면 (좌우 여백 없이 100% 꽉 찬 풀스크린) */
    @media (max-width: 839px) {
      body {
        background: rgba(248, 250, 252, 0.95);
      }
      .game-screen {
        width: 100vw !important;
        max-width: 100vw !important;
        max-height: 100dvh !important;
        height: 100dvh !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        padding: 6px 6px;
      }
    }

    /* 🏷️ 상단 네비게이션 & 헤더 (가로 너비 일체화) */
    .top-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
      padding: 0 2px;
      box-sizing: border-box;
    }
    .btn-nav {
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.08);
      color: #334155;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 800;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.15s ease;
    }
    .btn-nav:active {
      transform: scale(0.95);
      background: rgba(226, 232, 240, 0.8);
    }
    .btn-nav.icon-only {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 10px;
      font-size: 15px;
    }

    .header-title {
      font-size: 16px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 🕹️ 게임 정보 & 난이도 컨트롤 바 (화이트 글래스모피즘) */
    .game-info-bar {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      box-sizing: border-box;
    }
    select, .btn-action {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 10px;
      border: 1px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.75);
      color: #0f172a;
      cursor: pointer;
      font-weight: 800;
      outline: none;
      transition: all 0.15s ease;
      touch-action: manipulation;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }
    .btn-action:active {
      transform: scale(0.95);
      background: rgba(226, 232, 240, 0.8);
    }
    .btn-action.btn-refresh-only {
      width: 34px;
      height: 34px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      border-radius: 10px;
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.1);
      color: #334155;
    }

    /* 🎨 스도쿠 보드 컨테이너 (화이트 글래스모피즘) */
    #sudoku-board-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      background: rgba(255, 255, 255, 0.95);
      border: 2.5px solid #0284c7;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      grid-template-rows: repeat(9, 1fr);
      overflow: hidden;
      box-sizing: border-box;
      margin-top: 4px;
      margin-bottom: auto; /* 🌟 중간 여백을 자연스럽게 확보 */
    }

    .sudoku-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(16px, 5.2vw, 24px);
      font-weight: 800;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.9);
      border-right: 1px solid rgba(0, 0, 0, 0.08);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      cursor: pointer;
      transition: background 0.1s ease, transform 0.1s ease;
    }
    .sudoku-cell:nth-child(3n) {
      border-right: 2px solid #0284c7;
    }
    .sudoku-cell:nth-child(9n) {
      border-right: none;
    }
    .sudoku-cell.row-bottom-box {
      border-bottom: 2px solid #0284c7;
    }

    /* 셀 상태 스타일 */
    .sudoku-cell.fixed {
      color: #0f172a;
      font-weight: 900;
      background: rgba(241, 245, 249, 0.92);
    }
    .sudoku-cell.user-input {
      color: #0284c7;
      font-weight: 900;
    }
    .sudoku-cell.x-mode-diag {
      background: #f3e8ff; /* X모드 대각선 보라빛 */
    }
    .sudoku-cell.crosshair {
      background: rgba(224, 242, 254, 0.6) !important;
    }
    .sudoku-cell.same-number {
      background: #38bdf8 !important;
      color: #ffffff !important;
    }
    .sudoku-cell.selected {
      background: #facc15 !important;
      color: #0f172a !important;
      transform: scale(1.04);
      z-index: 5;
      box-shadow: 0 0 10px rgba(250,204,21,0.6);
      border-radius: 4px;
    }

    /* ✏️ 3x3 메모 그리드 */
    .notes-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 1px;
      pointer-events: none;
    }
    .note-num {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(7px, 2vw, 9.5px);
      font-weight: 700;
      color: #64748b;
      line-height: 1;
      transition: all 0.1s ease;
    }
    .note-num.note-highlight {
      color: #d97706 !important;
      font-weight: 900 !important;
      transform: scale(1.3);
      text-shadow: 0 0 4px rgba(245, 158, 11, 0.6);
    }

    /* ⌨️ 하단 스마트 키패드 (화면 최하단 여백 배치 & 화이트 글래스모피즘) */
    #keypad-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      box-sizing: border-box;
      margin-top: auto; /* 🌟 최하단 배치 */
      margin-bottom: 6px;
    }
    .keypad-row {
      display: flex;
      gap: 5px;
      width: 100%;
    }
    .key-btn {
      flex: 1;
      height: clamp(36px, 5.4dvh, 44px);
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      color: #0f172a;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      transition: all 0.12s ease;
    }
    .key-btn:active {
      transform: scale(0.93);
      background: #e2e8f0;
    }
    .key-btn.key-selected {
      background: #0284c7 !important;
      color: #ffffff !important;
      border-color: #38bdf8 !important;
      box-shadow: 0 0 10px rgba(2,132,199,0.4);
      transform: scale(0.96);
    }
    .key-btn.btn-delete {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #ef4444;
    }
    .key-btn.disabled {
      opacity: 0.3 !important;
      cursor: not-allowed !important;
      pointer-events: none !important;
      background: rgba(0, 0, 0, 0.05) !important;
      border-color: rgba(0, 0, 0, 0.08) !important;
      color: #94a3b8 !important;
      box-shadow: none !important;
    }

    /* 3행 기능 버튼 스타일 (임시저장, 되돌리기, 메모) */
    .key-btn.btn-func {
      font-size: 12px;
      gap: 5px;
      background: rgba(241, 245, 249, 0.9);
      border-color: rgba(0, 0, 0, 0.08);
      color: #334155;
    }
    .key-btn.btn-memo.active {
      background: linear-gradient(135deg, #f59e0b, #d97706) !important;
      color: #ffffff !important;
      border-color: #fde047 !important;
      box-shadow: 0 0 10px rgba(245,158,11,0.4) !important;
      font-weight: 900;
    }

    /* ✨ 클리어 모달 공통 (화이트 테마) */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 50;
      padding: 16px;
      text-align: center;
      color: #0f172a;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .clear-title {
      font-size: 20px;
      font-weight: 900;
      color: #16a34a;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 12.5px;
      color: #475569;
      margin-bottom: 12px;
      line-height: 1.6;
    }
    .xp-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #ffffff;
      font-weight: 900;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 10px rgba(245,158,11,0.3);
    }
    .btn-modal-next {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    /* 🏆 기록 리스트 팝업 모달 */
    .record-box {
      width: 88%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      color: #0f172a;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .record-box h3 {
      font-size: 15px;
      font-weight: 900;
      color: #d97706;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .record-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      font-size: 12px;
    }
    .record-row:last-child {
      border-bottom: none;
    }
    .record-diff {
      font-weight: 800;
      color: #0f172a;
    }
    .record-stat {
      font-weight: 800;
      color: #0284c7;
    }
    .record-max {
      font-size: 10.5px;
      color: #64748b;
      font-weight: 600;
    }

    /* 🍞 심플 인게임 토스트 알림 */
    #sudokuToast {
      position: absolute;
      bottom: 130px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid #38bdf8;
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 60;
      white-space: nowrap;
    }
    #sudokuToast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="game-screen" id="gameScreen">

    <!-- 🏷️ 1행: 최상단 네비게이션 (뒤로가기 / 게임제목 / 기록) -->
    <div class="top-nav">
      <button class="btn-nav icon-only" onclick="closeGameAndReturn()" title="포켓Tasks로 복귀" style="font-size:18px; font-weight:900;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="display:block;">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>
      <div class="header-title">
        🧩 Sudoku
      </div>
      <button class="btn-nav icon-only" onclick="openRecordsModal()" title="난이도별 연승 기록">
        🏆
      </button>
    </div>

    <!-- 🕹️ 2행: 게임 정보 & 난이도 선택 & 새로고침 (1열) -->
    <div class="game-info-bar">
      <div style="background:rgba(255,255,255,0.75); border:1px solid rgba(0,0,0,0.08); border-radius:10px; padding:6px 10px; font-size:12px; font-weight:800; color:#0f172a; display:flex; align-items:center; gap:4px; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
        <span style="color:#64748b;">빈칸:</span>
        <span style="color:#0284c7;" id="emptyCountText">0개</span>
      </div>
      <select id="stageSelect" onchange="generateStage()" style="flex:1; min-width:0; background:rgba(255,255,255,0.75); border:1px solid rgba(0,0,0,0.1); color:#0f172a; font-weight:800; font-size:12px; border-radius:10px; padding:6px 8px; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
        <option value="hard" selected>🔴 어려움 (+30XP)</option>
        <option value="hell">💀 지옥 (+50XP)</option>
        <option value="xmode">🔮 X모드 (+50XP)</option>
      </select>
      <button class="btn-action btn-refresh-only" onclick="generateStage()" title="새 퍼즐 새로고침">🔄</button>
    </div>

    <!-- 🎨 스도쿠 9x9 그리드 보드 -->
    <div id="sudoku-board-container"></div>

    <!-- 🍞 인게임 토스트 -->
    <div id="sudokuToast"></div>

    <!-- ⌨️ 하단 스마트 키패드 (1 2 3 4 5 / 6 7 8 9 X / 임시저장, 되돌리기, 메모) -->
    <div id="keypad-container">
      <!-- 1행: 1 2 3 4 5 -->
      <div class="keypad-row">
        <button id="btn-key-1" class="key-btn" onclick="handleKeyInput(event, 1)">1</button>
        <button id="btn-key-2" class="key-btn" onclick="handleKeyInput(event, 2)">2</button>
        <button id="btn-key-3" class="key-btn" onclick="handleKeyInput(event, 3)">3</button>
        <button id="btn-key-4" class="key-btn" onclick="handleKeyInput(event, 4)">4</button>
        <button id="btn-key-5" class="key-btn" onclick="handleKeyInput(event, 5)">5</button>
      </div>
      <!-- 2행: 6 7 8 9 X -->
      <div class="keypad-row">
        <button id="btn-key-6" class="key-btn" onclick="handleKeyInput(event, 6)">6</button>
        <button id="btn-key-7" class="key-btn" onclick="handleKeyInput(event, 7)">7</button>
        <button id="btn-key-8" class="key-btn" onclick="handleKeyInput(event, 8)">8</button>
        <button id="btn-key-9" class="key-btn" onclick="handleKeyInput(event, 9)">9</button>
        <button id="btn-key-0" class="key-btn btn-delete" onclick="handleKeyInput(event, 0)" title="지우기">❌</button>
      </div>
      <!-- 3행: 3열 기능 버튼 (저장 💾, 되돌리기 ↩️, 메모 ✏️) -->
      <div class="keypad-row">
        <button id="btn-save" class="key-btn btn-func" onclick="saveProgress(event)" title="현재 진행 상태 영구 저장">
          <span>💾</span>
          <span>저장</span>
        </button>
        <button id="btn-restore" class="key-btn btn-func" onclick="restoreProgress(event)" title="저장된 상태로 되돌리기">
          <span>↩️</span>
          <span>되돌리기</span>
        </button>
        <button id="btn-memo" class="key-btn btn-func btn-memo" onclick="toggleMemo(event)" title="후보 숫자 메모 토글">
          <span>✏️</span>
          <span>메모</span>
        </button>
      </div>
    </div>

    <!-- 🎉 스테이지 클리어 모달 -->
    <div class="modal-overlay" id="clearModal">
      <div class="clear-title" id="clearTitleText">🎉 CLEAR!</div>
      <div class="modal-desc" id="clearDescText">스도쿠 퍼즐을 완벽하게 완성했습니다!</div>
      <div class="xp-badge" id="clearXpBadge">+30 XP 획득! 🎁</div>
      <div class="modal-btns">
        <button class="btn-modal-next" onclick="generateStage()">다음 퍼즐 🚀</button>
      </div>
    </div>

    <!-- 🏆 난이도별 연속 기록 모달 -->
    <div class="modal-overlay" id="recordsModal">
      <div class="record-box">
        <h3>
          <span>🏆 난이도별 연승 기록</span>
          <span style="cursor:pointer; font-size:16px;" onclick="closeRecordsModal()">✕</span>
        </h3>
        <div class="record-row">
          <span class="record-diff">🔥 어려움</span>
          <div>
            <span class="record-stat" id="recStreak_hard">0</span> <span class="record-max" id="recMax_hard">(최고 0)</span>
          </div>
        </div>
        <div class="record-row">
          <span class="record-diff">💀 지옥</span>
          <div>
            <span class="record-stat" id="recStreak_hell">0</span> <span class="record-max" id="recMax_hell">(최고 0)</span>
          </div>
        </div>
        <div class="record-row">
          <span class="record-diff">🔮 X모드</span>
          <div>
            <span class="record-stat" id="recStreak_xmode">0</span> <span class="record-max" id="recMax_xmode">(최고 0)</span>
          </div>
        </div>
        <div style="margin-top:14px; text-align:center;">
          <button class="btn-action" style="padding:6px 18px;" onclick="closeRecordsModal()">닫기</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    let solutionBoard = [];
    let initialBoard = [];
    let userBoard = [];
    let currentStageKey = "hard";
    let isXModeActive = false;

    let selectedCell = null;     // { r, c }
    let selectedNumber = null;   // 숫자 먼저 선택 모드 (1~9, 0)
    let highlightNum = null;     // 하이라이트할 숫자
    let isMemoMode = false;      // 메모 모드 활성화 여부
    let savedSnapshot = null;    // 🌟 [요청 1]: 임시저장 스냅샷 (메모 포함)
    let sessionTotalEarnedXp = 0; // 🌟 포켓Tasks 메인 화면 전달용 누적 XP

    const STAGE_CONFIG = {
      "hard": { name: "어려움", holes: 46, passes: 1, baseReward: 30 },
      "hell": { name: "지옥", holes: 64, passes: 2, baseReward: 50 },
      "xmode": { name: "X모드", holes: 54, passes: 2, baseReward: 50 }
    };

    // ========================================================
    // 🏆 연승 기록 관리 (localStorage)
    // ========================================================
    function loadGameRecords() {
      try {
        const data = localStorage.getItem('sudoku_records_v2');
        return data ? JSON.parse(data) : {};
      } catch(e) {
        return {};
      }
    }

    function saveGameRecords(records) {
      try {
        localStorage.setItem('sudoku_records_v2', JSON.stringify(records));
      } catch(e) {}
    }

    function getStageRecord(stageKey) {
      const rec = loadGameRecords();
      return rec[stageKey] || { currentStreak: 0, maxStreak: 0 };
    }

    function updateStreakOnClear(stageKey) {
      const rec = loadGameRecords();
      if (!rec[stageKey]) rec[stageKey] = { currentStreak: 0, maxStreak: 0 };
      rec[stageKey].currentStreak = (rec[stageKey].currentStreak || 0) + 1;
      if (rec[stageKey].currentStreak > (rec[stageKey].maxStreak || 0)) {
        rec[stageKey].maxStreak = rec[stageKey].currentStreak;
      }
      saveGameRecords(rec);
      return rec[stageKey];
    }

    function openRecordsModal() {
      const rec = loadGameRecords();
      ["hard", "hell", "xmode"].forEach(key => {
        const item = rec[key] || { currentStreak: 0, maxStreak: 0 };
        document.getElementById(`recStreak_${key}`).innerText = `${item.currentStreak || 0}연승`;
        document.getElementById(`recMax_${key}`).innerText = `(최고 ${item.maxStreak || 0}연승)`;
      });
      document.getElementById('recordsModal').classList.add('show');
    }

    function closeRecordsModal() {
      document.getElementById('recordsModal').classList.remove('show');
    }

    // ========================================================
    // 🍞 인게임 토스트 알림
    // ========================================================
    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('sudokuToast');
      if (!toast) return;
      toast.innerText = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 1600);
    }

    // ========================================================
    // 📐 보드 너비 및 상단 바 100% 일체화 동기화 (화면 가로폭에 맞게 꽉 채움)
    // ========================================================
    function syncBoardWidths() {
      const container = document.getElementById('sudoku-board-container');
      if (!container) return;

      const screenEl = document.getElementById('gameScreen');
      const availableW = screenEl.clientWidth - 8;
      const availableH = window.innerHeight - 190;
      const maxW = Math.max(280, Math.min(availableW, availableH, 480));

      container.style.width = maxW + 'px';
      container.style.height = maxW + 'px';

      const topNav = document.querySelector('.top-nav');
      const keypad = document.getElementById('keypad-container');

      if (topNav) {
        topNav.style.maxWidth = maxW + 'px';
        topNav.style.width = maxW + 'px';
      }
      if (keypad) {
        keypad.style.maxWidth = maxW + 'px';
        keypad.style.width = maxW + 'px';
      }
    }

    // ========================================================
    // 📳 모바일 햅틱 진동 유틸리티
    // ========================================================
    function triggerHaptic(pattern = 30) {
      if (typeof navigator !== "undefined" && "vibrate" in navigator) {
        try {
          navigator.vibrate(pattern);
        } catch(e) {}
      }
    }

    // 🌟 [요청 5]: 숫자 9칸 완성 또는 한 줄(행/열/3x3박스) 완성 추적 세트
    let completedNumbers = new Set();
    let completedRows = new Set();
    let completedCols = new Set();
    let completedBoxes = new Set();

    function resetCompletionTracking() {
      completedNumbers.clear();
      completedRows.clear();
      completedCols.clear();
      completedBoxes.clear();

      // 현재 초기 보드 상태 기준 이미 꽉 찬 줄/숫자 등록
      checkSudokuLineOrNumberCompletion(true);
    }

    function checkSudokuLineOrNumberCompletion(isSilentInit = false) {
      let newlyCompleted = false;

      // 1) 숫자 9칸 완성 체크
      const numCounts = Array(10).fill(0);
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const v = (initialBoard[r][c] !== 0) ? initialBoard[r][c] : userBoard[r][c].val;
          if (v >= 1 && v <= 9) numCounts[v]++;
        }
      }
      for (let n = 1; n <= 9; n++) {
        if (numCounts[n] === 9 && !completedNumbers.has(n)) {
          completedNumbers.add(n);
          newlyCompleted = true;
        } else if (numCounts[n] < 9 && completedNumbers.has(n)) {
          completedNumbers.delete(n);
        }
      }

      // 2) 가로 행(Row) 9칸 완성 체크 (1~9 중복 없음)
      for (let r = 0; r < 9; r++) {
        const rowSet = new Set();
        for (let c = 0; c < 9; c++) {
          const v = (initialBoard[r][c] !== 0) ? initialBoard[r][c] : userBoard[r][c].val;
          if (v >= 1 && v <= 9) rowSet.add(v);
        }
        if (rowSet.size === 9 && !completedRows.has(r)) {
          completedRows.add(r);
          newlyCompleted = true;
        } else if (rowSet.size < 9 && completedRows.has(r)) {
          completedRows.delete(r);
        }
      }

      // 3) 세로 열(Col) 9칸 완성 체크
      for (let c = 0; c < 9; c++) {
        const colSet = new Set();
        for (let r = 0; r < 9; r++) {
          const v = (initialBoard[r][c] !== 0) ? initialBoard[r][c] : userBoard[r][c].val;
          if (v >= 1 && v <= 9) colSet.add(v);
        }
        if (colSet.size === 9 && !completedCols.has(c)) {
          completedCols.add(c);
          newlyCompleted = true;
        } else if (colSet.size < 9 && completedCols.has(c)) {
          completedCols.delete(c);
        }
      }

      // 4) 3x3 박스 완성 체크
      for (let br = 0; br < 3; br++) {
        for (let bc = 0; bc < 3; bc++) {
          const bIdx = br * 3 + bc;
          const boxSet = new Set();
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
              const v = (initialBoard[br * 3 + r][bc * 3 + c] !== 0) 
                ? initialBoard[br * 3 + r][bc * 3 + c] 
                : userBoard[br * 3 + r][bc * 3 + c].val;
              if (v >= 1 && v <= 9) boxSet.add(v);
            }
          }
          if (boxSet.size === 9 && !completedBoxes.has(bIdx)) {
            completedBoxes.add(bIdx);
            newlyCompleted = true;
          } else if (boxSet.size < 9 && completedBoxes.has(bIdx)) {
            completedBoxes.delete(bIdx);
          }
        }
      }

      // 🌟 한 숫자 9칸 또는 한 줄이 새로 완성되었을 때 찰진 햅틱 진동!
      if (newlyCompleted && !isSilentInit) {
        triggerHaptic([35, 30, 55]);
      }
    }

    // ========================================================
    // 🧠 100% 즉시 생성 보장 스도쿠 엔진
    // ========================================================
    function isValid(board, r, c, num, isX) {
      for (let i = 0; i < 9; i++) {
        if (board[r][i] === num || board[i][c] === num) return false;
        const boxR = Math.floor(r / 3) * 3 + Math.floor(i / 3);
        const boxC = Math.floor(c / 3) * 3 + (i % 3);
        if (board[boxR][boxC] === num) return false;
      }
      if (isX) {
        if (r === c) {
          for (let i = 0; i < 9; i++) if (board[i][i] === num) return false;
        }
        if (r + c === 8) {
          for (let i = 0; i < 9; i++) if (board[i][8 - i] === num) return false;
        }
      }
      return true;
    }

    // 🧠 2) 완성 정답 보드 무작위 생성 (MRV 휴리스틱: 가장 경우의 수 적은 칸 우선 탐색)
    function solveBoard(board, isX) {
      let minCandidates = 10;
      let targetCell = null;
      let validNums = [];

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          if (board[r][c] === 0) {
            const possible = [];
            for (let num = 1; num <= 9; num++) {
              if (isValid(board, r, c, num, isX)) possible.push(num);
            }
            if (possible.length === 0) return false;
            if (possible.length < minCandidates) {
              minCandidates = possible.length;
              targetCell = { r, c };
              validNums = possible;
              if (minCandidates === 1) break;
            }
          }
        }
        if (minCandidates === 1) break;
      }

      if (!targetCell) return true; // 9x9 완성!

      validNums.sort(() => Math.random() - 0.5);

      for (let num of validNums) {
        board[targetCell.r][targetCell.c] = num;
        if (solveBoard(board, isX)) return true;
        board[targetCell.r][targetCell.c] = 0;
      }
      return false;
    }

    // 🧠 3) 🌟 유일해(Unique Solution) 개수 카운터 (2개 이상 시 즉시 조기 탈출)
    function countSolutions(board, isX, limit = 2) {
      let solutions = 0;

      function backtrack() {
        if (solutions >= limit) return;

        let minCandidates = 10;
        let targetCell = null;
        let validNums = [];

        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (board[r][c] === 0) {
              const possible = [];
              for (let num = 1; num <= 9; num++) {
                if (isValid(board, r, c, num, isX)) possible.push(num);
              }
              if (possible.length === 0) return;
              if (possible.length < minCandidates) {
                minCandidates = possible.length;
                targetCell = { r, c };
                validNums = possible;
                if (minCandidates === 1) break;
              }
            }
          }
          if (minCandidates === 1) break;
        }

        if (!targetCell) {
          solutions++;
          return;
        }

        for (let num of validNums) {
          board[targetCell.r][targetCell.c] = num;
          backtrack();
          board[targetCell.r][targetCell.c] = 0;
          if (solutions >= limit) return;
        }
      }

      backtrack();
      return solutions;
    }

    // 🧠 4) 🌟 100% 유일해 & 논리적 풀이 보장 스테이지 생성
    function generateStage() {
      document.getElementById('clearModal').classList.remove('show');
      document.getElementById('recordsModal').classList.remove('show');

      currentStageKey = document.getElementById('stageSelect').value;
      const cfg = STAGE_CONFIG[currentStageKey] || STAGE_CONFIG["hard"];
      isXModeActive = (currentStageKey === "xmode");
      savedSnapshot = null; // 새 스테이지 시작 시 스냅샷 리셋

      // 1) 완전한 정답 보드 생성
      solutionBoard = Array.from({ length: 9 }, () => Array(9).fill(0));
      solveBoard(solutionBoard, isXModeActive);

      // 2) 🌟 유일해를 100% 보장하며 멀티패스 굴착 (지옥 난이도는 유일해 한계치까지 극한 굴착)
      initialBoard = solutionBoard.map(row => [...row]);
      
      let holesDug = 0;
      const maxTargetHoles = cfg.holes;
      const passes = cfg.passes || 1;

      for (let p = 0; p < passes; p++) {
        const positions = [];
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (initialBoard[r][c] !== 0) positions.push({ r, c });
          }
        }
        positions.sort(() => Math.random() - 0.5);

        for (let pos of positions) {
          if (holesDug >= maxTargetHoles) break;

          const backup = initialBoard[pos.r][pos.c];
          initialBoard[pos.r][pos.c] = 0;

          // 🌟 유일해(해가 정확히 1개)가 깨지지 않는지 검증!
          if (countSolutions(initialBoard, isXModeActive, 2) === 1) {
            holesDug++;
          } else {
            // 유일해가 깨지면(찍기/불량 퍼즐이 되면) 즉시 복원!
            initialBoard[pos.r][pos.c] = backup;
          }
        }
      }

      // 3) 사용자 입력 데이터 초기화
      userBoard = Array.from({ length: 9 }, () => 
        Array(9).fill(null).map(() => ({ val: 0, notes: new Set() }))
      );

      selectedCell = null;
      selectedNumber = null;
      highlightNum = null;

      syncBoardWidths();
      renderBoard();
      renderKeypad();
      updateStatusDisplay();
      resetCompletionTracking();
    }

    // ========================================================
    // 💾 영구 저장 (localStorage) & ↩️ 난이도 일치 되돌리기 기능
    // ========================================================
    function loadSavedSlot() {
      try {
        const data = localStorage.getItem('sudoku_saved_slot_v2');
        return data ? JSON.parse(data) : null;
      } catch(e) {
        return null;
      }
    }

    function updateRestoreButtonState() {
      const restoreBtn = document.getElementById('btn-restore');
      if (!restoreBtn) return;

      const slot = loadSavedSlot();
      // 저장된 기록이 있고, 저장된 난이도와 현재 난이도가 일치할 때만 활성화
      if (slot && slot.stageKey === currentStageKey) {
        restoreBtn.classList.remove('disabled');
        restoreBtn.removeAttribute('disabled');
        restoreBtn.title = `[${STAGE_CONFIG[slot.stageKey]?.name || slot.stageKey}] 저장 시점으로 되돌리기`;
      } else {
        restoreBtn.classList.add('disabled');
        restoreBtn.setAttribute('disabled', 'true');
        if (!slot) {
          restoreBtn.title = "저장된 기록이 없습니다";
        } else {
          const slotName = STAGE_CONFIG[slot.stageKey]?.name || slot.stageKey;
          restoreBtn.title = `[${slotName}] 난이도에 저장된 기록이 있습니다`;
        }
      }
    }

    function saveProgress(e) {
      if (e) e.stopPropagation();

      const existing = loadSavedSlot();
      if (existing) {
        const diffName = STAGE_CONFIG[existing.stageKey]?.name || existing.stageKey;
        const isOverwrite = confirm(`⚠️ 이전에 저장된 [${diffName}] 진행 기록이 있습니다.\n현재 상태로 덮어씌우시겠습니까?`);
        if (!isOverwrite) return;
      }

      const slot = {
        stageKey: currentStageKey,
        initialBoard: initialBoard.map(r => [...r]),
        solutionBoard: solutionBoard.map(r => [...r]),
        userBoard: userBoard.map(r => r.map(c => ({ val: c.val, notes: Array.from(c.notes) }))),
        isXModeActive: isXModeActive,
        timestamp: Date.now()
      };

      try {
        localStorage.setItem('sudoku_saved_slot_v2', JSON.stringify(slot));
        showToast("💾 현재 진행 상태가 저장되었습니다!");
        updateRestoreButtonState();
      } catch(err) {
        alert("저장에 실패했습니다.");
      }
    }

    function restoreProgress(e) {
      if (e) e.stopPropagation();
      const slot = loadSavedSlot();
      if (!slot) {
        showToast("⚠️ 저장된 진행 기록이 없습니다!");
        return;
      }

      if (slot.stageKey !== currentStageKey) {
        const slotName = STAGE_CONFIG[slot.stageKey]?.name || slot.stageKey;
        showToast(`⚠️ [${slotName}] 난이도에 저장된 기록입니다!`);
        return;
      }

      // 100% 온전하게 복원
      initialBoard = slot.initialBoard.map(r => [...r]);
      solutionBoard = slot.solutionBoard.map(r => [...r]);
      userBoard = slot.userBoard.map(r => r.map(c => ({ val: c.val, notes: new Set(c.notes) })));
      isXModeActive = slot.isXModeActive;

      selectedCell = null;
      selectedNumber = null;
      highlightNum = null;

      syncBoardWidths();
      renderBoard();
      renderKeypad();
      updateStatusDisplay();
      resetCompletionTracking();
      showToast("↩️ 저장했던 진행 상태를 불러왔습니다!");
    }

    // ========================================================
    // 🌟 [요청 3]: 정답 기입 시 같은 행/열/3x3박스/대각선 메모 즉시 삭제
    // ========================================================
    function clearRelatedNotes(targetR, targetC, num) {
      if (!num || num <= 0) return;

      // 1) 해당 칸 자체의 메모 완전 삭제
      userBoard[targetR][targetC].notes.clear();

      // 2) 같은 행 & 같은 열
      for (let i = 0; i < 9; i++) {
        if (i !== targetC) userBoard[targetR][i].notes.delete(num);
        if (i !== targetR) userBoard[i][targetC].notes.delete(num);
      }

      // 3) 같은 3x3 서브박스
      const startR = Math.floor(targetR / 3) * 3;
      const startC = Math.floor(targetC / 3) * 3;
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const curR = startR + r;
          const curC = startC + c;
          if (curR !== targetR || curC !== targetC) {
            userBoard[curR][curC].notes.delete(num);
          }
        }
      }

      // 4) X모드 대각선
      if (isXModeActive) {
        if (targetR === targetC) {
          for (let i = 0; i < 9; i++) {
            if (i !== targetR) userBoard[i][i].notes.delete(num);
          }
        }
        if (targetR + targetC === 8) {
          for (let i = 0; i < 9; i++) {
            if (i !== targetR) userBoard[i][8 - i].notes.delete(num);
          }
        }
      }
    }

    // ========================================================
    // 🎨 스도쿠 보드 및 키패드 렌더링
    // ========================================================
    function renderBoard() {
      const container = document.getElementById('sudoku-board-container');
      if (!container) return;
      container.innerHTML = '';

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const cell = document.createElement('div');
          const isFixed = (initialBoard[r][c] !== 0);
          const currentVal = isFixed ? initialBoard[r][c] : userBoard[r][c].val;
          const notes = userBoard[r][c].notes;

          cell.className = 'sudoku-cell';
          if (r === 2 || r === 5) cell.classList.add('row-bottom-box');
          if (isFixed) cell.classList.add('fixed');
          else if (currentVal !== 0) cell.classList.add('user-input');

          if (isXModeActive && (r === c || r + c === 8)) cell.classList.add('x-mode-diag');

          // 하이라이트 계산
          if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
            cell.classList.add('selected');
          } else if (selectedCell && (selectedCell.r === r || selectedCell.c === c)) {
            cell.classList.add('crosshair');
          }

          if (highlightNum && currentVal === highlightNum && (!selectedCell || selectedCell.r !== r || selectedCell.c !== c)) {
            cell.classList.add('same-number');
          }

          if (currentVal !== 0) {
            cell.innerText = currentVal;
          } else if (notes && notes.size > 0) {
            const notesGrid = document.createElement('div');
            notesGrid.className = 'notes-grid';
            for (let n = 1; n <= 9; n++) {
              const noteEl = document.createElement('div');
              noteEl.className = 'note-num';
              if (notes.has(n)) {
                noteEl.innerText = n;
                // 🌟 [요청 2]: 선택된 숫자와 같은 조그만 메모 후보 숫자도 노란색으로 강조!
                if (highlightNum && highlightNum === n) {
                  noteEl.classList.add('note-highlight');
                }
              }
              notesGrid.appendChild(noteEl);
            }
            cell.appendChild(notesGrid);
          }

          cell.onclick = (e) => {
            e.stopPropagation();
            onCellClick(r, c);
          };

          container.appendChild(cell);
        }
      }
    }

    function renderKeypad() {
      // 🌟 [요청 4]: 보드 전체에서 각 숫자가 9개 다 찼는지 카운트
      const numCounts = Array(10).fill(0);
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const v = (initialBoard[r][c] !== 0) ? initialBoard[r][c] : userBoard[r][c].val;
          if (v >= 1 && v <= 9) numCounts[v]++;
        }
      }

      for (let i = 1; i <= 9; i++) {
        const btn = document.getElementById(`btn-key-${i}`);
        if (btn) {
          if (selectedNumber === i) btn.classList.add('key-selected');
          else btn.classList.remove('key-selected');

          // 9개 모두 채워졌으면 버튼 비활성화 (disabled)
          if (numCounts[i] >= 9) {
            btn.classList.add('disabled');
            if (selectedNumber === i) {
              selectedNumber = null;
              if (highlightNum === i) highlightNum = null;
            }
          } else {
            btn.classList.remove('disabled');
          }
        }
      }

      const memoBtn = document.getElementById('btn-memo');
      if (memoBtn) {
        if (isMemoMode) memoBtn.classList.add('active');
        else memoBtn.classList.remove('active');
      }

      // 🌟 되돌리기 버튼 활성화 상태 최신화 (저장된 난이도와 일치할 때만 활성화)
      updateRestoreButtonState();
    }

    function updateStatusDisplay() {
      let emptyCount = 0;
      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const v = initialBoard[r][c] !== 0 ? initialBoard[r][c] : userBoard[r][c].val;
          if (v === 0) emptyCount++;
        }
      }
      const elEmpty = document.getElementById('emptyCountText');
      if (elEmpty) elEmpty.innerText = `${emptyCount}개`;

      const elDiff = document.getElementById('diffLabelText');
      if (elDiff) {
        const cfg = STAGE_CONFIG[currentStageKey] || STAGE_CONFIG["hard"];
        elDiff.innerText = cfg.name;
      }

      const elStreak = document.getElementById('currentStreakText');
      if (elStreak) {
        const record = getStageRecord(currentStageKey);
        elStreak.innerText = `${record.currentStreak || 0}연승`;
      }
    }

    // ========================================================
    // 👆 스마트 터치 조작 시스템 (셀 우선 & 숫자 우선 양방향 완벽 지원)
    // ========================================================
    function onCellClick(r, c) {
      // 1) [숫자 먼저 선택 모드]: 특정 숫자가 고정된 상태에서 칸을 연속으로 탭할 때
      if (selectedNumber !== null) {
        if (initialBoard[r][c] === 0) {
          if (selectedNumber === 0) {
            // 지우기
            userBoard[r][c].val = 0;
            userBoard[r][c].notes.clear();
          } else if (isMemoMode) {
            // 메모 모드: 후보 숫자 토글
            userBoard[r][c].val = 0;
            if (userBoard[r][c].notes.has(selectedNumber)) {
              userBoard[r][c].notes.delete(selectedNumber);
            } else {
              userBoard[r][c].notes.add(selectedNumber);
            }
          } else {
            // 일반 기입: 고정된 숫자 기입 및 겹치는 메모 자동 삭제
            userBoard[r][c].val = selectedNumber;
            clearRelatedNotes(r, c, selectedNumber);
          }
          checkClearCondition();
        }
        highlightNum = (selectedNumber !== 0) ? selectedNumber : null;
      } 
      // 2) [셀 먼저 선택 모드]: 칸을 탭하여 선택
      else {
        selectedCell = { r, c };
        const v = initialBoard[r][c] !== 0 ? initialBoard[r][c] : userBoard[r][c].val;
        highlightNum = (v !== 0) ? v : null;
      }

      renderBoard();
      renderKeypad();
      updateStatusDisplay();
    }

    function handleKeyInput(e, num) {
      if (e) e.stopPropagation();

      // A) [셀이 이미 선택된 상태]: 선택된 칸에 즉시 기입
      if (selectedCell !== null) {
        const { r, c } = selectedCell;
        if (initialBoard[r][c] === 0) {
          if (num === 0) {
            // 지우기
            userBoard[r][c].val = 0;
            userBoard[r][c].notes.clear();
            highlightNum = null;
          } else if (isMemoMode) {
            // 메모 모드: 셀 선택 유지하며 후보 숫자 연속 토글
            userBoard[r][c].val = 0;
            if (userBoard[r][c].notes.has(num)) {
              userBoard[r][c].notes.delete(num);
            } else {
              userBoard[r][c].notes.add(num);
            }
          } else {
            // 일반 기입 및 겹치는 메모 즉시 삭제
            userBoard[r][c].val = num;
            clearRelatedNotes(r, c, num);
            highlightNum = num;
          }
          checkClearCondition();
        }
      } 
      // B) [셀이 선택되지 않은 상태]: 숫자를 먼저 선택하여 고정 (연속 입력 모드)
      else {
        if (selectedNumber === num) {
          selectedNumber = null;
          highlightNum = null;
        } else {
          selectedNumber = num;
          highlightNum = (num !== 0) ? num : null;
        }
      }

      renderBoard();
      renderKeypad();
      updateStatusDisplay();
    }

    function toggleMemo(e) {
      if (e) e.stopPropagation();
      isMemoMode = !isMemoMode;
      renderKeypad();
    }

    // 바깥 빈 공간 클릭 시에만 선택 해제
    document.addEventListener('click', (e) => {
      if (e.target.closest('#sudoku-board-container, #keypad-container, .controls, .top-nav, .modal-overlay, #sudokuToast')) {
        return;
      }
      selectedCell = null;
      selectedNumber = null;
      highlightNum = null;
      renderBoard();
      renderKeypad();
    });

    // ========================================================
    // 🎉 클리어 검사 & 다중 정답(규칙 만족 여부) 검증 알고리즘
    // ========================================================
    function isCompleteValidSudoku(board, isX) {
      // 1) 각 행(Row) 검사: 1~9가 중복 없이 9개 모두 존재하는지
      for (let r = 0; r < 9; r++) {
        const rowSet = new Set();
        for (let c = 0; c < 9; c++) {
          const v = board[r][c];
          if (v < 1 || v > 9 || rowSet.has(v)) return false;
          rowSet.add(v);
        }
      }

      // 2) 각 열(Col) 검사: 1~9가 중복 없이 9개 모두 존재하는지
      for (let c = 0; c < 9; c++) {
        const colSet = new Set();
        for (let r = 0; r < 9; r++) {
          const v = board[r][c];
          if (v < 1 || v > 9 || colSet.has(v)) return false;
          colSet.add(v);
        }
      }

      // 3) 각 3x3 서브박스 검사: 1~9가 중복 없이 9개 모두 존재하는지
      for (let boxR = 0; boxR < 9; boxR += 3) {
        for (let boxC = 0; boxC < 9; boxC += 3) {
          const boxSet = new Set();
          for (let r = 0; r < 3; r++) {
            for (let c = 0; c < 3; c++) {
              const v = board[boxR + r][boxC + c];
              if (v < 1 || v > 9 || boxSet.has(v)) return false;
              boxSet.add(v);
            }
          }
        }
      }

      // 4) X모드 대각선 검사 (활성화된 경우)
      if (isX) {
        const diag1Set = new Set();
        const diag2Set = new Set();
        for (let i = 0; i < 9; i++) {
          const v1 = board[i][i];
          const v2 = board[i][8 - i];
          if (v1 < 1 || v1 > 9 || diag1Set.has(v1)) return false;
          if (v2 < 1 || v2 > 9 || diag2Set.has(v2)) return false;
          diag1Set.add(v1);
          diag2Set.add(v2);
        }
      }

      return true;
    }

    function checkClearCondition() {
      // 🌟 [요청 5]: 숫자 9칸 완성 또는 행/열/3x3 한 줄 완성 햅틱 검사
      checkSudokuLineOrNumberCompletion();

      // 1) 보드 전체가 빈칸 없이 모두 채워졌는지 검사 & 현재 9x9 보드 구성
      const currentFullBoard = Array.from({ length: 9 }, () => Array(9).fill(0));

      for (let r = 0; r < 9; r++) {
        for (let c = 0; c < 9; c++) {
          const uVal = (initialBoard[r][c] !== 0) ? initialBoard[r][c] : userBoard[r][c].val;
          if (uVal === 0) return; // 아직 빈칸이 남아있으면 클리어 판정 대기
          currentFullBoard[r][c] = uVal;
        }
      }

      // 2) 🌟 생성 시의 정답과 달라도, 스도쿠 퍼즐 규칙을 완벽히 만족하면 정답 인정!
      if (isCompleteValidSudoku(currentFullBoard, isXModeActive)) {
        handleSudokuClear();
      }
    }

    function handleSudokuClear() {
      // 🌟 [요청 5]: 게임 클리어 시 승리 햅틱 진동
      triggerHaptic([60, 50, 80, 60, 160]);

      const cfg = STAGE_CONFIG[currentStageKey] || STAGE_CONFIG["hard"];
      const rewardXp = cfg.baseReward;
      const updatedRec = updateStreakOnClear(currentStageKey);

      document.getElementById('clearTitleText').innerText = `🎉 ${cfg.name} 난이도 ${updatedRec.currentStreak}연승 Clear!`;
      document.getElementById('clearDescText').innerHTML = `
        스도쿠 퍼즐을 오차 없이 완벽하게 완성했습니다!<br>
        포켓몬에게 보상 경험치가 지급됩니다.
      `;
      document.getElementById('clearXpBadge').innerText = `총 +${rewardXp} XP 획득! 🎁`;
      document.getElementById('clearModal').classList.add('show');

      // 세션 누적 경험치 가산 & 로컬 저장
      sessionTotalEarnedXp += rewardXp;
      try {
        localStorage.setItem('SUDOKU_PENDING_XP', sessionTotalEarnedXp);
      } catch(e) {}
    }

    // ========================================================
    // 🚪 포켓Tasks로 복귀 (모아둔 경험치 한 번에 전달!)
    // ========================================================
    function closeGameAndReturn() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'GAME_FINISHED_RETURN',
          gameType: 'sudoku',
          gameName: 'Sudoku',
          totalXp: sessionTotalEarnedXp
        }, '*');
      } else {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = './index.html?rewardXp=' + sessionTotalEarnedXp;
        }
      }
    }

    window.onload = generateStage;
    window.onresize = syncBoardWidths;
  </script>
</body>
</html>
